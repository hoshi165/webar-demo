<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  body { margin:0; overflow:hidden; background:black; font-family:sans-serif; }
  /* ビデオは背後で動かすが、トラブル確認用に小さく表示（デバッグ後に opacity:0 にしてください） */
  #video { position:absolute; top:0; left:0; width:1px; height:1px; opacity:0.1; pointer-events:none; }
  #glCanvas { position:absolute; width:100vw; height:100vh; object-fit:cover; z-index: 1; }
  
  #char {
    position:absolute; width:150px; top:50%; left:50%;
    transform:translate(-50%,-50%) scale(1);
    touch-action:none; z-index: 10;
  }

  /* UI・ボタン類 */
  #bottom-bar { position:fixed; bottom:20px; width:100%; display:flex; justify-content:space-around; align-items:center; z-index:1000; }
  .control-btn { width:72px; height:48px; border-radius:8px; background:rgba(0,0,0,0.5); color:white; border:none; backdrop-filter:blur(10px); }
  #captureBtn { width:68px; height:68px; cursor: pointer; }

  .panel { position:fixed; bottom:-140px; width:100%; background:rgba(0,0,0,0.85); display:flex; justify-content:space-around; padding:12px 0; transition:0.3s; z-index: 1100; }
  .panel.active { bottom:120px; }
  .panel button { width:90px; height:36px; border-radius:8px; border:none; }
  .panel button.active { background:#666; color:white; border:2px solid #fff; }

  #preview { position:fixed; inset:0; display:none; flex-direction:column; background:black; z-index:2000; align-items:center; justify-content:center; }
  #result { width:100%; object-fit: contain; }
  #previewControls { position:absolute; bottom:20px; width:100%; display:flex; justify-content:space-around; }

  #flash { position:fixed; inset:0; background:white; opacity:0; z-index:1500; pointer-events:none; }
  #status { position:fixed; top:10px; left:10px; color:red; z-index:3000; font-size:10px; background:rgba(0,0,0,0.5); }
</style>
</head>
<body>

<div id="status">Wait...</div>
<video id="video" autoplay playsinline muted></video>
<canvas id="glCanvas"></canvas>
<img id="char" src="soctest1.png">

<div id="bottom-bar">
  <button class="control-btn" onclick="switchCamera()">切替</button>
  <button class="control-btn" onclick="toggleCharPanel()">キャラ</button>
  <img id="captureBtn" src="camera.png" onclick="captureImage()">
  <button class="control-btn" onclick="toggleFilter()">フィルタ</button>
  <button class="control-btn" onclick="resetChar()">リセット</button>
</div>

<div id="filterPanel" class="panel">
  <button data-filter="none" class="active">ノーマル</button>
  <button data-filter="retro">エモい</button>
  <button data-filter="vivid">ビビッド</button>
  <button data-filter="cinema">シネマ</button>
</div>

<div id="charPanel" class="panel">
  <button onclick="selectChar(1)">soctest1</button>
  <button onclick="selectChar(2)">soctest2</button>
</div>

<div id="preview">
  <img id="result">
  <div id="previewControls">
    <button class="control-btn" style="background:#666" onclick="saveImage()">保存</button>
    <button class="control-btn" style="background:#666" onclick="closePreview()">キャンセル</button>
  </div>
</div>

<div id="flash"></div>

<script>
const video = document.getElementById("video");
const glCanvas = document.getElementById("glCanvas");
const char = document.getElementById("char");
const status = document.getElementById("status");
const gl = glCanvas.getContext("webgl", { preserveDrawingBuffer: true, alpha: false });

let facingMode = "environment";
let currentFilter = "none";
let isVideoPlaying = false;

// --- WebGL Setup (最適化) ---
const vsSource = `attribute vec2 p; varying vec2 v; void main(){ v=p*0.5+0.5; gl_Position=vec4(p,0,1); }`;
const fsSource = `
  precision mediump float;
  varying vec2 v;
  uniform sampler2D s;
  uniform int m;

  vec3 vivid(vec3 c) { return clamp((c - 0.5) * 1.5 + 0.5, 0.0, 1.0); }
  vec3 retro(vec3 c) { return mix(c, vec3(dot(c, vec3(0.299, 0.587, 0.114))) * vec3(1.2, 1.0, 0.8), 0.6); }
  vec3 cinema(vec3 c) { return pow(c * vec3(0.8, 0.9, 1.0), vec3(1.3)); }

  void main() {
    // 映像の上下反転を修正
    vec4 col = texture2D(s, vec2(v.x, 1.0 - v.y));
    if(m == 1) col.rgb = retro(col.rgb);
    else if(m == 2) col.rgb = vivid(col.rgb);
    else if(m == 3) col.rgb = cinema(col.rgb);
    gl_FragColor = col;
  }
`;

function compileShader(t, s) {
  const sh = gl.createShader(t);
  gl.shaderSource(sh, s);
  gl.compileShader(sh);
  return sh;
}

const prog = gl.createProgram();
gl.attachShader(prog, compileShader(gl.VERTEX_SHADER, vsSource));
gl.attachShader(prog, compileShader(gl.FRAGMENT_SHADER, fsSource));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
const pLoc = gl.getAttribLocation(prog, "p");
gl.enableVertexAttribArray(pLoc);
gl.vertexAttribPointer(pLoc, 2, gl.FLOAT, false, 0, 0);

const uMode = gl.getUniformLocation(prog, "m");
const texture = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, texture);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

// --- 安定したカメラ起動 ---
async function startCamera() {
  status.innerText = "Camera starting...";
  if(video.srcObject) {
    video.srcObject.getTracks().forEach(t => t.stop());
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ 
      video: { facingMode, width: {ideal: 1280}, height: {ideal: 720} },
      audio: false
    });
    video.srcObject = stream;
    // iOS Safari対策: play()を明示的に呼ぶ
    await video.play();
    isVideoPlaying = true;
    status.innerText = "Playing";
  } catch (err) {
    status.innerText = "Error: " + err.message;
    console.error(err);
  }
}

// 毎フレーム実行される描画ループ
function render() {
  if (isVideoPlaying && video.readyState >= video.HAVE_CURRENT_DATA) {
    // キャンバスサイズをビデオに合わせる（一度だけ実行）
    if (glCanvas.width !== video.videoWidth) {
      glCanvas.width = video.videoWidth;
      glCanvas.height = video.videoHeight;
    }

    gl.viewport(0, 0, glCanvas.width, glCanvas.height);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);

    let mode = 0;
    if(currentFilter === "retro") mode = 1;
    else if(currentFilter === "vivid") mode = 2;
    else if(currentFilter === "cinema") mode = 3;

    gl.uniform1i(uMode, mode);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  requestAnimationFrame(render);
}

// --- UI制御 ---
function toggleFilter(){ document.getElementById("filterPanel").classList.toggle("active"); document.getElementById("charPanel").classList.remove("active"); }
function toggleCharPanel(){ document.getElementById("charPanel").classList.toggle("active"); document.getElementById("filterPanel").classList.remove("active"); }
function selectChar(n){ char.src = n===1?"soctest1.png":"soctest2.png"; document.getElementById("charPanel").classList.remove("active"); }
function switchCamera(){ isVideoPlaying = false; facingMode = facingMode === "user" ? "environment" : "user"; startCamera(); }
function closePreview(){ document.getElementById("preview").style.display="none"; }
function saveImage(){ const a=document.createElement("a"); a.href=document.getElementById("result").src; a.download="photo.png"; a.click(); closePreview(); }

function captureImage() {
  if(navigator.vibrate) navigator.vibrate(10);
  document.getElementById("flash").style.opacity = 0.4;
  setTimeout(() => document.getElementById("flash").style.opacity = 0, 100);

  const canvas = document.createElement("canvas");
  canvas.width = glCanvas.width; canvas.height = glCanvas.height;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(glCanvas, 0, 0);

  const vW = video.videoWidth; const vH = video.videoHeight;
  const dW = glCanvas.clientWidth; const dH = glCanvas.clientHeight;
  const scale = Math.max(dW/vW, dH/vH);
  const offX = (dW - vW * scale) / 2; const offY = (dH - vH * scale) / 2;
  const cRect = char.getBoundingClientRect();

  ctx.drawImage(char, (cRect.left - offX)/scale, (cRect.top - offY)/scale, cRect.width/scale, cRect.height/scale);
  document.getElementById("result").src = canvas.toDataURL("image/png");
  document.getElementById("preview").style.display = "flex";
}

document.querySelectorAll("#filterPanel button").forEach(btn => {
  btn.onclick = () => {
    currentFilter = btn.dataset.filter;
    document.querySelectorAll("#filterPanel button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
  };
});

// 操作系（ドラッグ・ズーム）
let offsetX=window.innerWidth/2, offsetY=window.innerHeight/2, currentScale=1;
let isDragging=false, isPinching=false, startX, startY, startDist, startScale;

char.addEventListener("touchstart", e => {
  if(e.touches.length===1){ isDragging=true; startX=e.touches[0].clientX-offsetX; startY=e.touches[0].clientY-offsetY; }
  if(e.touches.length===2){ isPinching=true; startDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); startScale=currentScale; }
  e.preventDefault();
}, {passive: false});

document.addEventListener("touchmove", e => {
  if(isDragging && e.touches.length===1){
    offsetX=e.touches[0].clientX-startX; offsetY=e.touches[0].clientY-startY;
    char.style.left=offsetX+"px"; char.style.top=offsetY+"px";
  }
  if(isPinching && e.touches.length===2){
    let d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    currentScale = startScale * (d / startDist);
    char.style.transform = `translate(-50%,-50%) scale(${currentScale})`;
  }
}, {passive: false});

document.addEventListener("touchend", () => { isDragging=false; isPinching=false; });

function resetChar(){ offsetX=window.innerWidth/2; offsetY=window.innerHeight/2; currentScale=1; char.style.left="50%"; char.style.top="50%"; char.style.transform="translate(-50%,-50%) scale(1)"; }

// 初期化実行
startCamera();
render();
</script>
</body>
</html>
