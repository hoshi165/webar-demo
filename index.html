<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>
html,body{
  margin:0;padding:0;overflow:hidden;background:black;
}

#cameraVideo{
  position:fixed;
  width:100vw;height:100vh;
  object-fit:cover;
  z-index:0;
}

#char{
  position:fixed;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  width:40%;
  z-index:5;
}

#bottomBar{
  position:fixed;
  bottom:20px;
  width:100%;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:100;
}

.ctrlBtn{
  width:84px;
  padding:10px;
  border:none;
  border-radius:20px;
}

#captureBtn{
  width:68px;height:68px;
  border:none;background:none;
}

#captureBtn img{
  width:100%;
}

#filterPanel{
  position:fixed;
  bottom:-120px;
  width:100%;
  display:flex;
  justify-content:space-around;
  transition:0.3s;
  z-index:100;
  pointer-events:none;
}

#filterPanel.active{
  bottom:90px;
  pointer-events:auto;
}

.filterBtn{
  width:80px;
  padding:8px;
  background:#888;color:white;
  border:none;border-radius:16px;
}

.filterBtn.active{
  background:black;
}

#preview{
  position:fixed;
  width:100%;height:100%;
  background:black;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:200;
}

#preview img{
  width:90%;
}

#previewControls{
  margin-top:20px;
}

#flash{
  position:fixed;
  width:100%;height:100%;
  background:white;
  opacity:0;
  z-index:150;
}

/* エラー表示 */
#errorBox{
  position:fixed;
  top:10px;
  left:10px;
  right:10px;
  background:red;
  color:white;
  padding:10px;
  z-index:999;
  font-size:12px;
}
</style>
</head>

<body>

<div id="errorBox" style="display:none;"></div>

<video id="cameraVideo" autoplay playsinline></video>
<img id="char" src="soctest.png">

<div id="bottomBar">
  <button class="ctrlBtn" onclick="switchCamera()">カメラ切替</button>

  <button id="captureBtn">
    <img src="camera.png">
  </button>

  <button class="ctrlBtn" onclick="toggleFilter()">フィルター</button>
</div>

<div id="filterPanel">
  <button class="filterBtn" onclick="setFilter(0,this)">なし</button>
  <button class="filterBtn" onclick="setFilter(1,this)">白黒</button>
  <button class="filterBtn" onclick="setFilter(2,this)">セピア</button>
</div>

<div id="preview">
  <img id="previewImage">
  <div id="previewControls">
    <button onclick="saveImage()">保存</button>
    <button onclick="cancelShot()">キャンセル</button>
  </div>
</div>

<div id="flash"></div>

<audio id="shutter" src="shutter.mp3"></audio>
<canvas id="canvas" style="display:none;"></canvas>

<script>
let video=document.getElementById("cameraVideo");
let canvas=document.getElementById("canvas");
let ctx=canvas.getContext("2d");
let char=document.getElementById("char");
let preview=document.getElementById("preview");
let previewImage=document.getElementById("previewImage");
let flash=document.getElementById("flash");
let shutter=document.getElementById("shutter");
let bottomBar=document.getElementById("bottomBar");
let filterPanel=document.getElementById("filterPanel");
let errorBox=document.getElementById("errorBox");

let currentStream=null;

/* エラー表示 */
function showError(msg){
  errorBox.style.display="block";
  errorBox.innerText=msg;
}

/* カメラ */
async function startCamera(){
  try{
    if(currentStream){
      currentStream.getTracks().forEach(t=>t.stop());
    }

    currentStream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:"environment"}
    });

    video.srcObject = currentStream;

  }catch(e){
    showError("カメラ起動エラー: " + e.message);
    console.log(e);
  }
}
startCamera();

/* 切替 */
async function switchCamera(){
  try{
    let currentMode = video.srcObject?.getVideoTracks()[0]?.getSettings()?.facingMode;
    let mode = currentMode==="user" ? "environment" : "user";

    if(currentStream){
      currentStream.getTracks().forEach(t=>t.stop());
    }

    currentStream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:mode}
    });

    video.srcObject = currentStream;

  }catch(e){
    showError("カメラ切替エラー: " + e.message);
  }
}

/* フィルター */
const filters=["none","grayscale(1)","sepia(1)"];

function toggleFilter(){
  filterPanel.classList.toggle("active");
}

function setFilter(i,el){
  video.style.filter=filters[i];
  document.querySelectorAll(".filterBtn").forEach(b=>b.classList.remove("active"));
  el.classList.add("active");
}

/* 撮影 */
document.getElementById("captureBtn").onclick=()=>{
  try{

    shutter.currentTime=0;
    shutter.play().catch(()=>{});

    flash.style.opacity=1;
    setTimeout(()=>flash.style.opacity=0,100);

    bottomBar.style.display="none";
    filterPanel.style.display="none";

    setTimeout(()=>{

      if(!video.videoWidth){
        showError("カメラ未取得");
        return;
      }

      canvas.width=video.videoWidth;
      canvas.height=video.videoHeight;

      ctx.drawImage(video,0,0);

      let vRect=video.getBoundingClientRect();
      let cRect=char.getBoundingClientRect();

      let scale=canvas.width/vRect.width;

      let x=(cRect.left-vRect.left)*scale;
      let y=(cRect.top-vRect.top)*scale;
      let w=cRect.width*scale;
      let h=cRect.height*scale;

      ctx.drawImage(char,x,y,w,h);

      previewImage.src=canvas.toDataURL();
      preview.style.display="flex";

      bottomBar.style.display="flex";
      filterPanel.style.display="flex";

    },80);

  }catch(e){
    showError("撮影エラー: " + e.message);
  }
};

/* 保存 */
function saveImage(){
  let a=document.createElement("a");
  a.href=previewImage.src;
  a.download="photo.png";
  a.click();
  preview.style.display="none";
}

/* キャンセル */
function cancelShot(){
  preview.style.display="none";
}
</script>

</body>
</html>
