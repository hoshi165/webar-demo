<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>WebAR Camera</title>

<style>
body { margin:0; overflow:hidden; background:black; font-family:sans-serif; }
video { position:absolute; width:100%; height:100%; object-fit:cover; }

#char {
  position:absolute;
  width:150px;
  top:50%; left:50%;
  transform:translate(-50%, -50%) scale(1);
  touch-action:none;
}

#ui-layer {
  position:fixed; inset:0; z-index:1000;
}

.control-btn {
  height:48px; padding:0 16px;
  border-radius:16px;
  background:rgba(0,0,0,0.5);
  color:white; border:none;
  backdrop-filter: blur(10px);
}

#menuBtn {
  position:absolute; top:20px; left:20px;
  width:60px; height:60px; font-size:24px;
}

#bottom-bar {
  position:fixed; bottom:20px; width:100%;
  display:flex; justify-content:space-around; align-items:center;
}

#captureBtn {
  width:80px;
  height:80px;
  object-fit:contain;
  cursor:pointer;
  transition: transform 0.1s ease;
}
#captureBtn:active {
  transform: scale(0.9);
}

#filterPanel {
  position:fixed; bottom:-120px; width:100%;
  background:rgba(0,0,0,0.8);
  display:flex; justify-content:space-around;
  padding:10px 0; transition:0.3s;
}
#filterPanel.active { bottom:80px; }

#menuPanel {
  position:fixed; top:0; left:-260px;
  width:260px; height:100%;
  background:rgba(0,0,0,0.9);
  color:white; transition:0.3s;
  z-index:1500; padding:20px;
}
#menuPanel.open { left:0; }

#preview {
  position:fixed; inset:0;
  display:none; background:black;
  z-index:3000;
}
#preview img { width:100%; }

#previewControls {
  position:absolute; bottom:30px; width:100%; text-align:center;
}

#flash {
  position:fixed; inset:0;
  background:white; opacity:0;
  pointer-events:none; z-index:2500;
  transition:0.1s;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline></video>
<img id="char" src="soctest.png">

<div id="ui-layer">
  <button id="menuBtn" class="control-btn">≡</button>

  <div id="bottom-bar">
    <button class="control-btn" id="switchBtn">切替</button>
    <img id="captureBtn" src="camera.png">
    <button class="control-btn" id="filterBtn">フィルター</button>
  </div>

  <div id="filterPanel">
    <button class="control-btn" data-filter="none">なし</button>
    <button class="control-btn" data-filter="grayscale(1)">白黒</button>
    <button class="control-btn" data-filter="sepia(1)">セピア</button>
    <button class="control-btn" data-filter="brightness(1.3)">明るい</button>
  </div>
</div>

<div id="menuPanel">
  <h3>メニュー</h3>
  <p>今後機能追加</p>
</div>

<div id="preview">
  <img id="result">
  <div id="previewControls">
    <button onclick="saveImage()">保存</button>
    <button onclick="closePreview()">キャンセル</button>
  </div>
</div>

<div id="flash"></div>

<audio id="shutter" src="shutter.mp3"></audio>
<canvas id="canvas" style="display:none"></canvas>

<script>
let video = document.getElementById("video");
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");
let char = document.getElementById("char");
let preview = document.getElementById("preview");
let result = document.getElementById("result");
let shutter = document.getElementById("shutter");
let flash = document.getElementById("flash");

let facingMode = "environment";

async function startCamera(){
  let stream = await navigator.mediaDevices.getUserMedia({
    video:{ facingMode }
  });
  video.srcObject = stream;
}
startCamera();

// UI
menuBtn.onclick = ()=> menuPanel.classList.toggle("open");
filterBtn.onclick = ()=> filterPanel.classList.toggle("active");

switchBtn.onclick = ()=>{
  facingMode = facingMode === "user" ? "environment" : "user";
  startCamera();
};

document.querySelectorAll("#filterPanel button").forEach(btn=>{
  btn.onclick = ()=> video.style.filter = btn.dataset.filter;
});

// 撮影
captureBtn.onclick = ()=>{
  shutter.currentTime=0;
  shutter.play().catch(()=>{});

  flash.style.opacity=1;
  setTimeout(()=> flash.style.opacity=0,100);

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  ctx.filter = getComputedStyle(video).filter;
  ctx.drawImage(video,0,0);

  let vRect = video.getBoundingClientRect();
  let cRect = char.getBoundingClientRect();

  let scale = canvas.width / vRect.width;

  let x = (cRect.left - vRect.left) * scale;
  let y = (cRect.top - vRect.top) * scale;
  let w = cRect.width * scale;
  let h = cRect.height * scale;

  ctx.drawImage(char,x,y,w,h);

  result.src = canvas.toDataURL();
  preview.style.display="block";
};

function saveImage(){
  let link=document.createElement("a");
  link.href=result.src;
  link.download="photo.png";
  link.click();
  closePreview();
}

function closePreview(){
  preview.style.display="none";
  filterPanel.classList.remove("active");
}

// ===== マルチタッチ =====
let isDragging=false, isPinching=false;
let startX, startY, offsetX=window.innerWidth/2, offsetY=window.innerHeight/2;
let startDistance=0, startScale=1, currentScale=1;

function getDistance(t){
  let dx=t[0].clientX-t[1].clientX;
  let dy=t[0].clientY-t[1].clientY;
  return Math.sqrt(dx*dx+dy*dy);
}

char.addEventListener("touchstart",e=>{
  if(e.touches.length===1){
    isDragging=true; isPinching=false;
    startX=e.touches[0].clientX-offsetX;
    startY=e.touches[0].clientY-offsetY;
  }
  if(e.touches.length===2){
    isPinching=true; isDragging=false;
    startDistance=getDistance(e.touches);
    startScale=currentScale;
  }
});

document.addEventListener("touchmove",e=>{
  if(isDragging && e.touches.length===1){
    offsetX=e.touches[0].clientX-startX;
    offsetY=e.touches[0].clientY-startY;
    char.style.left=offsetX+"px";
    char.style.top=offsetY+"px";
  }

  if(isPinching && e.touches.length===2){
    let newDist=getDistance(e.touches);
    currentScale=startScale*(newDist/startDistance);
    currentScale=Math.max(0.3, Math.min(3,currentScale));
    char.style.transform=`translate(-50%,-50%) scale(${currentScale})`;
  }
});

document.addEventListener("touchend",()=>{
  isDragging=false; isPinching=false;
});

</script>
</body>
</html>
