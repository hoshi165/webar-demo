<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  body { margin:0; overflow:hidden; background:black; font-family:sans-serif; }
  video { display: none; }
  #glCanvas { position:absolute; width:100vw; height:100vh; object-fit:cover; z-index: 1; }
  
  /* 座標計算用のダミー。画面外へ隠す */
  #char { position:absolute; width:150px; top:50%; left:50%; transform:translate(-50%,-50%); opacity: 0; pointer-events: none; z-index: -1; }

  #bottom-bar { position:fixed; bottom:20px; width:100%; display:flex; justify-content:space-around; align-items:center; z-index:1000; }
  .control-btn { width:72px; height:48px; border-radius:8px; background:rgba(0,0,0,0.5); color:white; border:none; backdrop-filter:blur(10px); }
  #captureBtn { width:68px; height:68px; cursor: pointer; }

  .panel { position:fixed; bottom:-140px; width:100%; background:rgba(255,255,255,0.9); display:flex; justify-content:space-around; padding:20px 0; transition:0.3s; z-index: 1100; border-radius: 16px 16px 0 0; }
  .panel.active { bottom:120px; }
  .panel button { width:90px; height:40px; border-radius:8px; border:none; background: #eee; color: #000; font-weight: bold; }
  .panel button.active { background:#ccc; color:#000; }

  #preview { position:fixed; inset:0; display:none; flex-direction:column; background:black; z-index:2000; align-items:center; justify-content:center; }
  #result { width:100%; object-fit: contain; }
  #previewControls { position:absolute; bottom:20px; width:100%; display:flex; justify-content:space-around; }
  #flash { position:fixed; inset:0; background:white; opacity:0; z-index:1500; pointer-events:none; }
</style>
</head>
<body>

<video id="video" autoplay playsinline muted crossorigin="anonymous"></video>
<canvas id="glCanvas"></canvas>
<img id="char" src="soctest1.png" crossorigin="anonymous">

<div id="bottom-bar">
  <button class="control-btn" onclick="switchCamera()">切替</button>
  <button class="control-btn" onclick="toggleCharPanel()">キャラ</button>
  <img id="captureBtn" src="camera.png" onclick="captureImage()">
  <button class="control-btn" onclick="toggleFilter()">フィルタ</button>
  <button class="control-btn" onclick="resetChar()">リセット</button>
</div>

<div id="filterPanel" class="panel">
  <button data-filter="none" class="active">Normal</button>
  <button data-filter="retro">Retro</button>
  <button data-filter="vivid">Vivid</button>
  <button data-filter="cinema">Cinema</button>
</div>

<div id="charPanel" class="panel">
  <button onclick="selectChar(1)">soctest1</button>
  <button onclick="selectChar(2)">soctest2</button>
</div>

<div id="preview">
  <img id="result">
  <div id="previewControls">
    <button class="control-btn" style="background:#666" onclick="saveImage()">保存</button>
    <button class="control-btn" style="background:#666" onclick="closePreview()">キャンセル</button>
  </div>
</div>

<div id="flash"></div>

<script>
const video = document.getElementById("video");
const glCanvas = document.getElementById("glCanvas");
const char = document.getElementById("char");
let gl;

try {
  gl = glCanvas.getContext("webgl", { preserveDrawingBuffer: true, alpha: false, antialias: false });
} catch (e) {
  alert("WebGL not supported");
}

let currentFilter = "none";
let startTime = Date.now();
let facingMode = "environment";

// --- Shaders ---
const vsSource = `attribute vec2 p; varying vec2 v; void main(){ v=p*0.5+0.5; gl_Position=vec4(p,0,1); }`;
const fsSource = `
  precision mediump float;
  varying vec2 v;
  uniform sampler2D uV;
  uniform sampler2D uC;
  uniform int uM;
  uniform float uT;
  uniform vec4 uR;

  void main() {
    vec4 b = texture2D(uV, vec2(v.x, 1.0 - v.y));
    if(uM == 1) b.rgb = mix(b.rgb, vec3(dot(b.rgb, vec3(0.299, 0.587, 0.114))) * vec3(1.2, 1.0, 0.8), 0.6);
    else if(uM == 2) b.rgb = clamp((b.rgb - 0.5) * 1.5 + 0.5, 0.0, 1.0);
    else if(uM == 3) b.rgb = pow(b.rgb * vec3(0.8, 0.9, 1.0), vec3(1.3));

    vec4 res = b;
    if(v.x >= uR.x && v.x <= uR.x + uR.z && v.y >= uR.y && v.y <= uR.y + uR.w) {
      vec2 cuv = (v - uR.xy) / uR.zw;
      float p = sin(uT * 2.0) * 0.015;
      vec2 duv = cuv + (cuv - 0.5) * p;
      vec4 c = texture2D(uC, vec2(duv.x, 1.0 - duv.y));
      res.rgb = mix(b.rgb, c.rgb, c.a);
    }
    gl_FragColor = res;
  }
`;

function compile(t, s) {
  const r = gl.createShader(t);
  gl.shaderSource(r, s);
  gl.compileShader(r);
  if(!gl.getShaderParameter(r, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(r));
  return r;
}

const prg = gl.createProgram();
gl.attachShader(prg, compile(gl.VERTEX_SHADER, vsSource));
gl.attachShader(prg, compile(gl.FRAGMENT_SHADER, fsSource));
gl.linkProgram(prg);
gl.useProgram(prg);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
const pL = gl.getAttribLocation(prg, "p");
gl.enableVertexAttribArray(pL);
gl.vertexAttribPointer(pL, 2, gl.FLOAT, false, 0, 0);

const locV = gl.getUniformLocation(prg, "uV");
const locC = gl.getUniformLocation(prg, "uC");
const locM = gl.getUniformLocation(prg, "uM");
const locT = gl.getUniformLocation(prg, "uT");
const locR = gl.getUniformLocation(prg, "uR");

const texV = gl.createTexture();
const texC = gl.createTexture();

function setTex(t) {
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}
setTex(texV); setTex(texC);

function updateChar() {
  if(!char.complete) return;
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, texC);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, char);
}
char.onload = updateChar;

async function start() {
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode, width: 1280, height: 720 } });
    video.srcObject = s;
    video.onloadedmetadata = () => {
      video.play();
      // 初期サイズ確定
      glCanvas.width = video.videoWidth;
      glCanvas.height = video.videoHeight;
      updateChar();
      requestAnimationFrame(loop);
    };
  } catch (e) {
    alert("Camera Access Denied");
  }
}

function loop() {
  if (video.readyState >= 2) {
    gl.viewport(0, 0, glCanvas.width, glCanvas.height);
    
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, texV);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
    gl.uniform1i(locV, 0);

    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, texC);
    gl.uniform1i(locC, 1);

    gl.uniform1f(locT, (Date.now() - startTime) / 1000.0);
    
    let m = 0;
    if(currentFilter === "retro") m = 1;
    else if(currentFilter === "vivid") m = 2;
    else if(currentFilter === "cinema") m = 3;
    gl.uniform1i(locM, m);

    const vw = video.videoWidth, vh = video.videoHeight;
    const dw = glCanvas.clientWidth, dh = glCanvas.clientHeight;
    const sc = Math.max(dw/vw, dh/vh);
    const ox = (dw-vw*sc)/2, oy = (dh-vh*sc)/2;
    const r = char.getBoundingClientRect();
    gl.uniform4f(locR, (r.left-ox)/sc/vw, 1.0-((r.top-oy)/sc+r.height/sc)/vh, (r.width/sc)/vw, (r.height/sc)/vh);

    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  requestAnimationFrame(loop);
}

function captureImage() {
  const f = document.getElementById("flash"); f.style.opacity = 0.4; setTimeout(()=>f.style.opacity=0,100);
  document.getElementById("result").src = glCanvas.toDataURL("image/png");
  document.getElementById("preview").style.display = "flex";
}

function toggleFilter(){ document.getElementById("filterPanel").classList.toggle("active"); document.getElementById("charPanel").classList.remove("active"); }
function toggleCharPanel(){ document.getElementById("charPanel").classList.toggle("active"); document.getElementById("filterPanel").classList.remove("active"); }
function selectChar(n){ char.src = n===1?"soctest1.png":"soctest2.png"; document.getElementById("charPanel").classList.remove("active"); }
function switchCamera(){ facingMode = (facingMode === "user" ? "environment" : "user"); start(); }
function closePreview(){ document.getElementById("preview").style.display="none"; }
function saveImage(){ const a=document.createElement("a"); a.href=document.getElementById("result").src; a.download="ar_photo.png"; a.click(); closePreview(); }

let oX=window.innerWidth/2, oY=window.innerHeight/2, cS=1, iD=false, iP=false, sX, sY, sD, sS;
char.addEventListener("touchstart", e => {
  if(e.touches.length===1){ iD=true; sX=e.touches[0].clientX-oX; sY=e.touches[0].clientY-oY; }
  if(e.touches.length===2){ iP=true; sD=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); sS=cS; }
  e.preventDefault();
}, {passive: false});
document.addEventListener("touchmove", e => {
  if(iD && e.touches.length===1){ oX=e.touches[0].clientX-sX; oY=e.touches[0].clientY-sY; char.style.left=oX+"px"; char.style.top=oY+"px"; }
  if(iP && e.touches.length===2){ cS = sS * (Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY) / sD); char.style.transform = `translate(-50%,-50%) scale(${cS})`; }
}, {passive: false});
document.addEventListener("touchend", () => { iD=false; iP=false; });
function resetChar(){ oX=window.innerWidth/2; oY=window.innerHeight/2; cS=1; char.style.left="50%"; char.style.top="50%"; char.style.transform="translate(-50%,-50%) scale(1)"; }

document.querySelectorAll("#filterPanel button").forEach(b => { 
  b.onclick = () => { 
    currentFilter = b.dataset.filter; 
    document.querySelectorAll("#filterPanel button").forEach(x => x.classList.remove("active")); 
    b.classList.add("active"); 
  }; 
});

start();
</script>
</body>
</html>
