<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>WebGL AR Camera Pro</title>
<style>
body { margin:0; overflow:hidden; background:black; font-family:sans-serif; }
/* ビデオ本体は非表示にし、WebGL Canvasを表示の主役にする */
#video { display: none; }
#glCanvas { position:absolute; width:100vw; height:100vh; object-fit:cover; }

#char {
  position:absolute; width:150px; top:50%; left:50%;
  transform:translate(-50%,-50%) scale(1);
  touch-action:none; z-index: 10;
}

#bottom-bar {
  position:fixed; bottom:20px; width:100%;
  display:flex; justify-content:space-around; align-items:center; z-index:1000;
}

.control-btn {
  width:72px; height:48px; border-radius:8px;
  background:rgba(0,0,0,0.5); color:white; border:none; backdrop-filter:blur(10px);
}

#captureBtn { width:68px; height:68px; cursor: pointer; }

.panel {
  position:fixed; bottom:-140px; width:100%;
  background:rgba(0,0,0,0.85); display:flex; justify-content:space-around;
  padding:20px 0; transition:0.3s; z-index: 1100;
}
.panel.active { bottom:120px; }
.panel button { width:90px; height:40px; border-radius:8px; border:none; }
.panel button.active { background:#666; color:white; border:2px solid #fff; }

#preview {
  position:fixed; inset:0; display:none; flex-direction:column;
  background:black; z-index:2000; align-items:center; justify-content:center;
}
#result { max-width:100%; max-height:80%; }
#previewControls { margin-top:20px; display:flex; gap:20px; }

#flash {
  position:fixed; inset:0; background:white; opacity:0;
  z-index:1500; pointer-events:none;
}
</style>
</head>
<body>

<video id="video" autoplay playsinline></video>
<canvas id="glCanvas"></canvas>
<img id="char" src="soctest1.png">

<div id="bottom-bar">
  <button class="control-btn" onclick="switchCamera()">切替</button>
  <button class="control-btn" onclick="togglePanel(charPanel)">キャラ</button>
  <img id="captureBtn" src="camera.png" onclick="captureImage()">
  <button class="control-btn" onclick="togglePanel(filterPanel)">フィルタ</button>
  <button class="control-btn" onclick="resetChar()">リセット</button>
</div>

<div id="filterPanel" class="panel">
  <button class="active" onclick="setFilter('none', this)">Normal</button>
  <button onclick="setFilter('sepia', this)">Retro</button>
  <button onclick="setFilter('vivid', this)">Vivid</button>
  <button onclick="setFilter('cinema', this)">Cinema</button>
</div>

<div id="charPanel" class="panel">
  <button onclick="selectChar(1)">Char 1</button>
  <button onclick="selectChar(2)">Char 2</button>
</div>

<div id="preview">
  <img id="result">
  <div id="previewControls">
    <button class="control-btn" onclick="saveImage()">保存</button>
    <button class="control-btn" onclick="closePreview()">戻る</button>
  </div>
</div>

<div id="flash"></div>

<script>
const video = document.getElementById("video");
const glCanvas = document.getElementById("glCanvas");
const char = document.getElementById("char");
const charPanel = document.getElementById("charPanel");
const filterPanel = document.getElementById("filterPanel");
const gl = glCanvas.getContext("webgl", { preserveDrawingBuffer: true });

let facingMode = "environment";
let currentFilterType = "none";

// --- WebGL Shader Setup ---
const vsSource = `
  attribute vec2 aPos;
  varying vec2 vTexCoord;
  void main() {
    vTexCoord = aPos * 0.5 + 0.5;
    gl_Position = vec4(aPos, 0.0, 1.0);
  }
`;

const fsSource = `
  precision mediump float;
  varying vec2 vTexCoord;
  uniform sampler2D uSampler;
  uniform int uFilterMode;

  void main() {
    vec4 color = texture2D(uSampler, vTexCoord);
    
    if (uFilterMode == 1) { // Sepia
      float avg = dot(color.rgb, vec3(0.299, 0.587, 0.114));
      color.rgb = mix(color.rgb, vec3(avg) * vec3(1.2, 1.0, 0.8), 0.8);
    } else if (uFilterMode == 2) { // Vivid
      color.rgb = clamp((color.rgb - 0.5) * 1.3 + 0.5, 0.0, 1.0);
      color.rgb *= 1.2;
    } else if (uFilterMode == 3) { // Cinema
      color.rgb = color.rgb * vec3(0.8, 0.9, 1.0);
      color.rgb = pow(color.rgb, vec3(1.2));
    }
    
    gl_FragColor = color;
  }
`;

function createShader(gl, type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  return shader;
}

const program = gl.createProgram();
gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vsSource));
gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fsSource));
gl.linkProgram(program);
gl.useProgram(program);

const buffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

const aPos = gl.getAttribLocation(program, "aPos");
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const uFilterMode = gl.getUniformLocation(program, "uFilterMode");
const texture = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, texture);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

// --- Camera & Render Loop ---
async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({ 
    video: { facingMode, width: {ideal: 1280}, height: {ideal: 720} } 
  });
  video.srcObject = stream;
  video.onloadedmetadata = () => {
    glCanvas.width = video.videoWidth;
    glCanvas.height = video.videoHeight;
    render();
  };
}

function render() {
  gl.viewport(0, 0, glCanvas.width, glCanvas.height);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
  
  let mode = 0;
  if (currentFilterType === 'sepia') mode = 1;
  if (currentFilterType === 'vivid') mode = 2;
  if (currentFilterType === 'cinema') mode = 3;
  
  gl.uniform1i(uFilterMode, mode);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(render);
}

// --- UI Logic ---
function togglePanel(panel) {
  const isActive = panel.classList.contains("active");
  charPanel.classList.remove("active");
  filterPanel.classList.remove("active");
  if(!isActive) panel.classList.add("active");
}

function setFilter(type, btn) {
  currentFilterType = type;
  document.querySelectorAll("#filterPanel button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
}

function captureImage() {
  const finalCanvas = document.createElement("canvas");
  finalCanvas.width = glCanvas.width;
  finalCanvas.height = glCanvas.height;
  const fctx = finalCanvas.getContext("2d");

  // 1. WebGL側の結果（ビデオ+フィルタ）を描画
  fctx.drawImage(glCanvas, 0, 0);

  // 2. キャラクターを現在の見た目通りに合成
  const screenRect = glCanvas.getBoundingClientRect();
  const charRect = char.getBoundingClientRect();
  const ratio = glCanvas.width / screenRect.width;

  fctx.drawImage(
    char,
    (charRect.left - screenRect.left) * ratio,
    (charRect.top - screenRect.top) * ratio,
    charRect.width * ratio,
    charRect.height * ratio
  );

  document.getElementById("result").src = finalCanvas.toDataURL("image/png");
  document.getElementById("preview").style.display = "flex";
}

// --- Interactions (Drag/Pinch) ---
let posX = window.innerWidth/2, posY = window.innerHeight/2, scale = 1;
let startDist = 0, startScale = 1;

char.addEventListener("touchstart", e => {
  if (e.touches.length === 1) {
    this.isDragging = true;
  } else if (e.touches.length === 2) {
    startDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
    startScale = scale;
  }
});

document.addEventListener("touchmove", e => {
  if (e.touches.length === 1) {
    posX = e.touches[0].pageX;
    posY = e.touches[0].pageY;
    char.style.left = posX + "px";
    char.style.top = posY + "px";
  } else if (e.touches.length === 2) {
    const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
    scale = startScale * (dist / startDist);
    char.style.transform = `translate(-50%, -50%) scale(${scale})`;
  }
});

// 初期化
startCamera();
function switchCamera() {
  facingMode = facingMode === "user" ? "environment" : "user";
  startCamera();
}
function selectChar(n) {
  char.src = n === 1 ? "soctest1.png" : "soctest2.png";
  charPanel.classList.remove("active");
}
function resetChar() {
  posX = window.innerWidth/2; posY = window.innerHeight/2; scale = 1;
  char.style.left="50%"; char.style.top="50%"; char.style.transform="translate(-50%,-50%) scale(1)";
}
function saveImage() {
  const a = document.createElement("a");
  a.href = document.getElementById("result").src;
  a.download = "ar_photo.png";
  a.click();
}
function closePreview() { document.getElementById("preview").style.display="none"; }
</script>
</body>
</html>
