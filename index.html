<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pro WebAR Camera</title>
<style>
  :root { --btn-bg: rgba(0, 0, 0, 0.6); }
  body { margin: 0; overflow: hidden; background: #000; font-family: -apple-system, sans-serif; }
  
  /* カメラ・描画エリア */
  #container { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
  video, #glcanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
  
  /* キャラクター */
  #char {
    position: absolute; width: 150px; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(1);
    z-index: 10; touch-action: none; user-select: none;
    -webkit-user-drag: none;
  }

  /* UIレイアウト */
  .ui-layer { position: fixed; z-index: 100; width: 100%; pointer-events: none; }
  #bottom-bar { bottom: 30px; display: flex; justify-content: space-around; align-items: center; pointer-events: auto; }
  
  .control-btn {
    width: 60px; height: 60px; border-radius: 50%; background: var(--btn-bg);
    color: white; border: 2px solid rgba(255,255,255,0.2); backdrop-filter: blur(10px);
    font-size: 12px; cursor: pointer;
  }
  
  #captureBtn { width: 80px; height: 80px; background: white; border: 5px solid var(--btn-bg); }

  .panel {
    position: fixed; bottom: -150px; width: 100%; background: rgba(0,0,0,0.9);
    display: flex; justify-content: center; gap: 15px; padding: 20px 0;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: auto;
  }
  .panel.active { transform: translateY(-250px); }
  .panel button { padding: 10px 20px; border-radius: 8px; border: none; background: #444; color: white; }

  /* プレビュー画面 */
  #preview {
    position: fixed; inset: 0; background: #000; z-index: 2000;
    display: none; flex-direction: column; align-items: center; justify-content: center;
  }
  #result { max-width: 90%; max-height: 80%; border: 2px solid #333; }
  
  #flash { position: fixed; inset: 0; background: white; opacity: 0; pointer-events: none; z-index: 1500; }
</style>
</head>
<body>

<div id="container">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="glcanvas"></canvas>
  <img id="char" src="soctest1.png" alt="character">
</div>

<div class="ui-layer" id="bottom-bar">
  <button class="control-btn" onclick="switchCamera()">切替</button>
  <button class="control-btn" onclick="togglePanel('charPanel')">キャラ</button>
  <button id="captureBtn" class="control-btn" onclick="captureImage()"></button>
  <button class="control-btn" onclick="togglePanel('filterPanel')">色調</button>
  <button class="control-btn" onclick="resetChar()">戻す</button>
</div>

<div id="filterPanel" class="panel">
  <button onclick="setFilter('none')">Normal</button>
  <button onclick="setFilter('saturate(1.6) contrast(1.1)')">Vivid</button>
  <button onclick="setFilter('sepia(0.8)')">Retro</button>
</div>

<div id="charPanel" class="panel">
  <button onclick="selectChar('soctest1.png')">Char 1</button>
  <button onclick="selectChar('soctest2.png')">Char 2</button>
</div>

<div id="preview">
  <img id="result">
  <div style="margin-top:20px; display:flex; gap:20px;">
    <button class="control-btn" style="width:100px; border-radius:10px;" onclick="saveImage()">保存/共有</button>
    <button class="control-btn" style="width:100px; border-radius:10px;" onclick="closePreview()">戻る</button>
  </div>
</div>

<div id="flash"></div>
<canvas id="offscreenCanvas" style="display:none"></canvas>

<script>
const video = document.getElementById('video');
const char = document.getElementById('char');
const glCanvas = document.getElementById('glcanvas');
const flash = document.getElementById('flash');
const offscreenCanvas = document.getElementById('offscreenCanvas');

let currentStream = null;
let facingMode = "environment";
let currentFilter = "none";
let charState = { x: window.innerWidth/2, y: window.innerHeight/2, scale: 1, lastScale: 1 };

// 1. カメラ制御 (iOS/Android両対応)
async function startCamera() {
  if (currentStream) {
    currentStream.getTracks().forEach(track => track.stop());
  }
  const constraints = {
    video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false
  };
  try {
    currentStream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = currentStream;
  } catch (err) {
    alert("カメラの起動に失敗しました: " + err.message);
  }
}

function switchCamera() {
  facingMode = facingMode === "user" ? "environment" : "user";
  startCamera();
}

// 2. キャラクター操作 (マルチタッチ対応)
let evCache = [];
let prevDiff = -1;

char.addEventListener('pointerdown', e => {
  evCache.push(e);
  char.style.cursor = 'grabbing';
});

window.addEventListener('pointermove', e => {
  const index = evCache.findIndex(ev => ev.pointerId === e.pointerId);
  if (index < 0) return;
  evCache[index] = e;

  // ピンチズーム処理
  if (evCache.length === 2) {
    const curDiff = Math.hypot(evCache[0].clientX - evCache[1].clientX, evCache[0].clientY - evCache[1].clientY);
    if (prevDiff > 0) {
      charState.scale *= (curDiff / prevDiff);
      charState.scale = Math.max(0.2, Math.min(5, charState.scale));
    }
    prevDiff = curDiff;
  } 
  // ドラッグ処理
  else if (evCache.length === 1) {
    charState.x = e.clientX;
    charState.y = e.clientY;
  }
  updateCharTransform();
});

window.addEventListener('pointerup', e => {
  evCache = evCache.filter(ev => ev.pointerId !== e.pointerId);
  if (evCache.length < 2) prevDiff = -1;
});

function updateCharTransform() {
  char.style.left = `${charState.x}px`;
  char.style.top = `${charState.y}px`;
  char.style.transform = `translate(-50%, -50%) scale(${charState.scale})`;
}

// 3. 撮影機能 (座標計算・合成)
function captureImage() {
  // フラッシュ演出
  flash.style.opacity = 1;
  setTimeout(() => flash.style.opacity = 0, 150);

  const ctx = offscreenCanvas.getContext('2d');
  const vW = video.videoWidth;
  const vH = video.videoHeight;
  
  // キャンバスサイズをビデオ解像度に合わせる
  offscreenCanvas.width = vW;
  offscreenCanvas.height = vH;

  // ビデオの描画（フィルタ込）
  ctx.filter = currentFilter;
  
  // object-fit: cover をシミュレートして描画
  const videoRect = video.getBoundingClientRect();
  const canvasRatio = vW / vH;
  const screenRatio = videoRect.width / videoRect.height;
  
  let drawW, drawH, offsetX, offsetY;
  if (canvasRatio > screenRatio) {
    drawH = vH;
    drawW = vH * screenRatio;
    offsetX = (vW - drawW) / 2;
    offsetY = 0;
  } else {
    drawW = vW;
    drawH = vW / screenRatio;
    offsetX = 0;
    offsetY = (vH - drawH) / 2;
  }

  ctx.drawImage(video, 0, 0, vW, vH);

  // キャラの描画
  const charRect = char.getBoundingClientRect();
  const ratio = vW / videoRect.width;

  const charW = charRect.width * ratio;
  const charH = charRect.height * ratio;
  const charX = (charRect.left - videoRect.left) * ratio;
  const charY = (charRect.top - videoRect.top) * ratio;

  ctx.filter = "none";
  ctx.drawImage(char, charX, charY, charW, charH);

  document.getElementById('result').src = offscreenCanvas.toDataURL('image/png');
  document.getElementById('preview').style.display = 'flex';
}

// 4. 保存・共有機能
async function saveImage() {
  const blob = await (await fetch(document.getElementById('result').src)).blob();
  const file = new File([blob], 'ar_snap.png', { type: 'image/png' });

  if (navigator.share) {
    // スマホの共有メニューを呼び出し
    navigator.share({ files: [file], title: 'AR Snap' }).catch(() => {});
  } else {
    // PCブラウザ用ダウンロード
    const link = document.createElement('a');
    link.href = document.getElementById('result').src;
    link.download = 'ar_snap.png';
    link.click();
  }
}

// UI補助関数
function togglePanel(id) {
  document.querySelectorAll('.panel').forEach(p => {
    if(p.id !== id) p.classList.remove('active');
  });
  document.getElementById(id).classList.toggle('active');
}

function setFilter(f) {
  currentFilter = f;
  video.style.filter = f;
  togglePanel('filterPanel');
}

function selectChar(src) {
  char.src = src;
  togglePanel('charPanel');
}

function resetChar() {
  charState = { x: window.innerWidth/2, y: window.innerHeight/2, scale: 1 };
  updateCharTransform();
}

function closePreview() {
  document.getElementById('preview').style.display = 'none';
}

// 初期化
startCamera();
</script>
</body>
</html>
