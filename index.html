<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  body { margin:0; overflow:hidden; background:black; font-family:sans-serif; }
  video { display: none; }
  #glCanvas { position:absolute; width:100vw; height:100vh; object-fit:cover; z-index: 1; }
  
  #char {
    position:absolute; width:150px; top:50%; left:50%;
    transform:translate(-50%,-50%) scale(1);
    touch-action:none; z-index: 10; opacity: 0; pointer-events: none;
  }

  #bottom-bar { position:fixed; bottom:20px; width:100%; display:flex; justify-content:space-around; align-items:center; z-index:1000; }
  .control-btn { width:72px; height:48px; border-radius:8px; background:rgba(0,0,0,0.5); color:white; border:none; backdrop-filter:blur(10px); }
  #captureBtn { width:68px; height:68px; cursor: pointer; }

  .panel { position:fixed; bottom:-140px; width:100%; background:rgba(0,0,0,0.85); display:flex; justify-content:space-around; padding:12px 0; transition:0.3s; z-index: 1100; }
  .panel.active { bottom:120px; }
  .panel button { width:90px; height:36px; border-radius:8px; border:none; }
  .panel button.active { background:#666; color:white; border:2px solid #fff; }

  #preview { position:fixed; inset:0; display:none; flex-direction:column; background:black; z-index:2000; align-items:center; justify-content:center; }
  #result { width:100%; object-fit: contain; }
  #previewControls { position:absolute; bottom:20px; width:100%; display:flex; justify-content:space-around; }

  #flash { position:fixed; inset:0; background:white; opacity:0; z-index:1500; pointer-events:none; }
</style>
</head>
<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="glCanvas"></canvas>
<img id="char" src="soctest1.png">

<div id="bottom-bar">
  <button class="control-btn" onclick="switchCamera()">切替</button>
  <button class="control-btn" onclick="toggleCharPanel()">キャラ</button>
  <img id="captureBtn" src="camera.png" onclick="captureImage()">
  <button class="control-btn" onclick="toggleFilter()">フィルタ</button>
  <button class="control-btn" onclick="resetChar()">リセット</button>
</div>

<div id="filterPanel" class="panel">
  <button data-filter="none" class="active">Normal</button>
  <button data-filter="retro">Retro</button>
  <button data-filter="vivid">Vivid</button>
  <button data-filter="cinema">Cinema</button>
</div>

<div id="charPanel" class="panel">
  <button onclick="selectChar(1)">soctest1</button>
  <button onclick="selectChar(2)">soctest2</button>
</div>

<div id="preview">
  <img id="result">
  <div id="previewControls">
    <button class="control-btn" style="background:#666" onclick="saveImage()">保存</button>
    <button class="control-btn" style="background:#666" onclick="closePreview()">キャンセル</button>
  </div>
</div>

<div id="flash"></div>

<script>
const video = document.getElementById("video");
const glCanvas = document.getElementById("glCanvas");
const char = document.getElementById("char");
const gl = glCanvas.getContext("webgl", { preserveDrawingBuffer: true, alpha: false });

let facingMode = "environment";
let currentFilter = "none";
let startTime = Date.now();
let videoReady = false;

const vsSource = `attribute vec2 p; varying vec2 v; void main(){ v=p*0.5+0.5; gl_Position=vec4(p,0,1); }`;
const fsSource = `
  precision mediump float;
  varying vec2 v;
  uniform sampler2D uVid;
  uniform sampler2D uChar;
  uniform int uMode;
  uniform float uTime;
  uniform vec4 uCharRect;

  vec3 vivid(vec3 c) { return clamp((c - 0.5) * 1.5 + 0.5, 0.0, 1.0); }
  vec3 retro(vec3 c) { return mix(c, vec3(dot(c, vec3(0.299, 0.587, 0.114))) * vec3(1.2, 1.0, 0.8), 0.6); }
  vec3 cinema(vec3 c) { return pow(c * vec3(0.8, 0.9, 1.0), vec3(1.3)); }
  float rand(vec2 co){ return fract(sin(dot(co.xy ,vec3(12.9898,78.233,45.164))) * 43758.5453); }

  void main() {
    vec4 vidCol = texture2D(uVid, vec2(v.x, 1.0 - v.y));
    if(uMode == 1) vidCol.rgb = retro(vidCol.rgb);
    else if(uMode == 2) vidCol.rgb = vivid(vidCol.rgb);
    else if(uMode == 3) vidCol.rgb = cinema(vidCol.rgb);

    vec4 finalCol = vidCol;
    if(v.x >= uCharRect.x && v.x <= uCharRect.x + uCharRect.z && v.y >= uCharRect.y && v.y <= uCharRect.y + uCharRect.w) {
      vec2 cUV = (v - uCharRect.xy) / uCharRect.zw;
      float p = sin(uTime * 2.0) * 0.015;
      vec2 dUV = cUV + (cUV - 0.5) * p;
      vec4 cCol = texture2D(uChar, vec2(dUV.x, 1.0 - dUV.y));
      if(uMode == 2 && cCol.a > 0.8) {
        if(rand(cUV + uTime * 0.1) > 0.98) cCol.rgb += vec3(0.4);
      }
      finalCol.rgb = mix(vidCol.rgb, cCol.rgb, cCol.a);
    }
    gl_FragColor = finalCol;
  }
`;

function sh(t, s) { const r = gl.createShader(t); gl.shaderSource(r, s); gl.compileShader(r); return r; }
const prg = gl.createProgram();
gl.attachShader(prg, sh(gl.VERTEX_SHADER, vsSource));
gl.attachShader(prg, sh(gl.FRAGMENT_SHADER, fsSource));
gl.linkProgram(prg); gl.useProgram(prg);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
const pL = gl.getAttribLocation(prg, "p");
gl.enableVertexAttribArray(pL);
gl.vertexAttribPointer(pL, 2, gl.FLOAT, false, 0, 0);

const uV = gl.getUniformLocation(prg, "uVid");
const uC = gl.getUniformLocation(prg, "uChar");
const uM = gl.getUniformLocation(prg, "uMode");
const uT = gl.getUniformLocation(prg, "uTime");
const uR = gl.getUniformLocation(prg, "uCharRect");

const vT = gl.createTexture();
const cT = gl.createTexture();
function sT(tx) { gl.bindTexture(gl.TEXTURE_2D, tx); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); }
sT(vT); sT(cT);

function uCT() { gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, cT); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, char); }
char.onload = uCT;

async function startCamera() {
  if(video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
  const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode } });
  video.srcObject = s;
  await video.play();
  videoReady = true;
  uCT();
  requestAnimationFrame(render);
}

function render() {
  if (videoReady && video.readyState >= video.HAVE_CURRENT_DATA) {
    if (glCanvas.width !== video.videoWidth) { glCanvas.width = video.videoWidth; glCanvas.height = video.videoHeight; }
    gl.viewport(0, 0, glCanvas.width, glCanvas.height);
    gl.uniform1f(uT, (Date.now() - startTime) / 1000.0);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, vT);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
    gl.uniform1i(uV, 0);
    const vW = video.videoWidth, vH = video.videoHeight, dW = glCanvas.clientWidth, dH = glCanvas.clientHeight;
    const sc = Math.max(dW/vW, dH/vH), oX = (dW-vW*sc)/2, oY = (dH-vH*sc)/2, r = char.getBoundingClientRect();
    gl.uniform4f(uR, (r.left-oX)/sc/vW, 1.0-((r.top-oY)/sc+r.height/sc)/vH, (r.width/sc)/vW, (r.height/sc)/vH);
    gl.uniform1i(uC, 1);
    let m = 0; if(currentFilter === "retro") m = 1; else if(currentFilter === "vivid") m = 2; else if(currentFilter === "cinema") m = 3;
    gl.uniform1i(uM, m);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  requestAnimationFrame(render);
}

function captureImage() {
  if(navigator.vibrate) navigator.vibrate(10);
  const f = document.getElementById("flash"); f.style.opacity = 0.4; setTimeout(() => f.style.opacity = 0, 100);
  document.getElementById("result").src = glCanvas.toDataURL("image/png");
  document.getElementById("preview").style.display = "flex";
}

function toggleFilter(){ document.getElementById("filterPanel").classList.toggle("active"); document.getElementById("charPanel").classList.remove("active"); }
function toggleCharPanel(){ document.getElementById("charPanel").classList.toggle("active"); document.getElementById("filterPanel").classList.remove("active"); }
function selectChar(n){ char.src = n===1?"soctest1.png":"soctest2.png"; document.getElementById("charPanel").classList.remove("active"); }
function switchCamera(){ videoReady=false; facingMode = facingMode === "user" ? "environment" : "user"; startCamera(); }
function closePreview(){ document.getElementById("preview").style.display="none"; }
function saveImage(){ const a=document.createElement("a"); a.href=document.getElementById("result").src; a.download="photo.png"; a.click(); closePreview(); }

let oX=window.innerWidth/2, oY=window.innerHeight/2, cS=1, iD=false, iP=false, sX, sY, sD, sS;
char.addEventListener("touchstart", e => {
  if(e.touches.length===1){ iD=true; sX=e.touches[0].clientX-oX; sY=e.touches[0].clientY-oY; }
  if(e.touches.length===2){ iP=true; sD=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); sS=cS; }
  e.preventDefault();
}, {passive: false});
document.addEventListener("touchmove", e => {
  if(iD && e.touches.length===1){ oX=e.touches[0].clientX-sX; oY=e.touches[0].clientY-sY; char.style.left=oX+"px"; char.style.top=oY+"px"; }
  if(iP && e.touches.length===2){ cS = sS * (Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY) / sD); char.style.transform = `translate(-50%,-50%) scale(${cS})`; }
}, {passive: false});
document.addEventListener("touchend", () => { iD=false; iP=false; });
function resetChar(){ oX=window.innerWidth/2; oY=window.innerHeight/2; cS=1; char.style.left="50%"; char.style.top="50%"; char.style.transform="translate(-50%,-50%) scale(1)"; }

document.querySelectorAll("#filterPanel button").forEach(b => { b.onclick = () => { currentFilter = b.dataset.filter; document.querySelectorAll("#filterPanel button").forEach(x => x.classList.remove("active")); b.classList.add("active"); }; });

startCamera();
</script>
</body>
</html>
