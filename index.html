<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>
body { margin:0; overflow:hidden; background:black; font-family:sans-serif; }

video {
  position:absolute;
  width:100vw; height:100vh;
  object-fit:cover;
}

#char {
  position:absolute;
  width:150px;
  top:50%; left:50%;
  transform:translate(-50%,-50%) scale(1);
  touch-action:none;
}

#bottom-bar {
  position:fixed;
  bottom:20px;
  width:100%;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:1000;
}

.control-btn {
  width:72px;
  height:48px;
  border-radius:8px;
  background:rgba(0,0,0,0.5);
  color:white;
  border:none;
  backdrop-filter:blur(10px);
}

#captureBtn {
  width:68px; height:68px;
}

.panel {
  position:fixed;
  bottom:-140px;
  width:100%;
  background:rgba(0,0,0,0.85);
  display:flex;
  justify-content:space-around;
  padding:10px 0;
  transition:0.3s;
}
.panel.active { bottom:120px; }

/* ★ 修正②：選択中フィルター */
.panel button.active {
  background:#666;
  color:white;
}

#preview {
  position:fixed;
  inset:0;
  display:none;
  background:black;
  z-index:2000;
}

#preview img {
  width:100%;
}

#previewControls {
  position:absolute;
  bottom:20px;
  width:100%;
  display:flex;
  justify-content:space-around;
}

/* ★ 修正③：プレビューボタン */
.preview-btn {
  background:#666;
  color:white;
}

#flash {
  position:fixed;
  inset:0;
  background:black;
  opacity:0;
  z-index:1500;
  pointer-events:none;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline></video>
<img id="char" src="soctest1.png">

<div id="bottom-bar">
  <button class="control-btn" onclick="switchCamera()">切替</button>
  <button class="control-btn" onclick="toggleCharPanel()">キャラ</button>
  <img id="captureBtn" src="camera.png">
  <button class="control-btn" onclick="toggleFilter()">フィルタ</button>
  <button class="control-btn" onclick="resetChar()">リセット</button>
</div>

<div id="filterPanel" class="panel">
  <button data-filter="none">ノーマル</button>
  <button data-filter="sepia(0.6) contrast(1.2) brightness(1.1) saturate(1.4)">エモい</button>
  <button data-filter="saturate(1.6) contrast(1.2)">ビビッド</button>
  <button data-filter="hue-rotate(90deg) contrast(1.05)">クール</button>
</div>

<div id="charPanel" class="panel">
  <button onclick="selectChar(1)">soctest1</button>
  <button onclick="selectChar(2)">soctest2</button>
</div>

<div id="preview">
  <img id="result">
  <div id="previewControls">
    <!-- ★ 修正③：クラス追加 -->
    <button class="control-btn preview-btn" onclick="saveImage()">保存</button>
    <button class="control-btn preview-btn" onclick="closePreview()">キャンセル</button>
  </div>
</div>

<div id="flash"></div>
<canvas id="canvas" style="display:none"></canvas>

<script>
let video = document.getElementById("video");
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");
let char = document.getElementById("char");
let result = document.getElementById("result");
let preview = document.getElementById("preview");
let flash = document.getElementById("flash");
let filterPanel = document.getElementById("filterPanel");
let charPanel = document.getElementById("charPanel");

let facingMode = "environment";
let currentFilter = "none";

async function startCamera(){
  let stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode } });
  video.srcObject = stream;
}
startCamera();

function switchCamera(){
  facingMode = facingMode === "user" ? "environment" : "user";
  startCamera();
}

function toggleFilter(){
  filterPanel.classList.toggle("active");
  charPanel.classList.remove("active");
}

function toggleCharPanel(){
  charPanel.classList.toggle("active");
  filterPanel.classList.remove("active");
}

function selectChar(n){
  char.src = n===1?"soctest1.png":"soctest2.png";
  charPanel.classList.remove("active");
}

function resetChar(){
  char.style.left="50%";
  char.style.top="50%";
  char.style.transform="translate(-50%,-50%) scale(1)";
}

document.querySelectorAll("#filterPanel button").forEach(btn=>{
  btn.onclick = ()=>{
    currentFilter = btn.dataset.filter;
    video.style.filter = currentFilter;

    document.querySelectorAll("#filterPanel button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");

    if(navigator.vibrate) navigator.vibrate(10);
  };
});

let captureBtn = document.getElementById("captureBtn");

captureBtn.onclick = ()=>{
  if(navigator.vibrate) navigator.vibrate(10);

  flash.style.opacity=0.4;
  setTimeout(()=> flash.style.opacity=0,100);

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  /* ★ 修正①：フィルター確実適用 */
  ctx.save();
  ctx.filter = currentFilter;
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  ctx.restore();

  let vW = video.videoWidth;
  let vH = video.videoHeight;
  let dW = video.clientWidth;
  let dH = video.clientHeight;

  let scale = Math.max(dW/vW, dH/vH);
  let offsetX = (dW - vW*scale)/2;
  let offsetY = (dH - vH*scale)/2;

  let cRect = char.getBoundingClientRect();

  ctx.drawImage(
    char,
    (cRect.left - offsetX)/scale,
    (cRect.top - offsetY)/scale,
    cRect.width/scale,
    cRect.height/scale
  );

  result.src = canvas.toDataURL();
  preview.style.display="block";
};

function saveImage(){
  let a=document.createElement("a");
  a.href=result.src;
  a.download="photo.png";
  a.click();
  closePreview();
}

function closePreview(){
  preview.style.display="none";
  filterPanel.classList.remove("active");
  charPanel.classList.remove("active");
}

// タッチ操作
let isDragging=false, isPinching=false;
let startX, startY, offsetX=window.innerWidth/2, offsetY=window.innerHeight/2;
let startDistance=0, startScale=1, currentScale=1;

function getDistance(t){
  let dx=t[0].clientX-t[1].clientX;
  let dy=t[0].clientY-t[1].clientY;
  return Math.sqrt(dx*dx+dy*dy);
}

char.addEventListener("touchstart",e=>{
  if(e.touches.length===1){
    isDragging=true;
    startX=e.touches[0].clientX-offsetX;
    startY=e.touches[0].clientY-offsetY;
  }
  if(e.touches.length===2){
    isPinching=true;
    startDistance=getDistance(e.touches);
    startScale=currentScale;
  }
});

document.addEventListener("touchmove",e=>{
  if(isDragging && e.touches.length===1){
    offsetX=e.touches[0].clientX-startX;
    offsetY=e.touches[0].clientY-startY;
    char.style.left=offsetX+"px";
    char.style.top=offsetY+"px";
  }

  if(isPinching && e.touches.length===2){
    let newDist=getDistance(e.touches);
    currentScale=startScale*(newDist/startDistance);
    char.style.transform=`translate(-50%,-50%) scale(${currentScale})`;
  }
});

document.addEventListener("touchend",()=>{
  isDragging=false;
  isPinching=false;
});
</script>

</body>
</html>
