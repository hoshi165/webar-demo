<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>
html,body{
  margin:0;padding:0;overflow:hidden;background:black;
}

/* カメラ（歪み防止） */
#cameraVideo{
  position:fixed;
  width:100vw;height:100vh;
  object-fit:cover; /* ← これが重要 */
}

/* キャラ */
#char{
  position:fixed;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  width:40%;
  touch-action:none;
}

/* 下バー */
#bottomBar{
  position:fixed;
  bottom:20px;
  width:100%;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
}

.ctrlBtn{
  width:84px;
  padding:10px;
  border:none;
  border-radius:20px;
}

/* 撮影ボタン */
#captureBtn{
  width:68px;height:68px;
  border:none;background:none;
}

#captureBtn img{
  width:100%;
}

/* フィルター */
#filterPanel{
  position:fixed;
  bottom:-120px;
  width:100%;
  display:flex;
  justify-content:space-around;
  transition:0.3s;
}

#filterPanel.active{
  bottom:90px;
}

.filterBtn{
  width:80px;
  padding:8px;
  background:#888;color:white;
  border:none;border-radius:16px;
}

.filterBtn.active{
  background:black;
}

/* プレビュー */
#preview{
  position:fixed;
  width:100%;height:100%;
  background:black;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:30;
}

#preview img{
  width:90%;
}

#previewControls{
  margin-top:20px;
}

/* フラッシュ */
#flash{
  position:fixed;
  width:100%;height:100%;
  background:white;
  opacity:0;
  z-index:50;
}
</style>
</head>

<body>

<video id="cameraVideo" autoplay playsinline></video>
<img id="char" src="soctest.png">

<div id="bottomBar">
  <button class="ctrlBtn" onclick="switchCamera()">カメラ切替</button>

  <button id="captureBtn">
    <img src="camera.png">
  </button>

  <button class="ctrlBtn" onclick="toggleFilter()">フィルター</button>
</div>

<div id="filterPanel">
  <button class="filterBtn" onclick="setFilter(0,this)">なし</button>
  <button class="filterBtn" onclick="setFilter(1,this)">白黒</button>
  <button class="filterBtn" onclick="setFilter(2,this)">セピア</button>
</div>

<!-- プレビュー -->
<div id="preview">
  <img id="previewImage">
  <div id="previewControls">
    <button onclick="saveImage()">保存</button>
    <button onclick="cancelShot()">キャンセル</button>
  </div>
</div>

<div id="flash"></div>

<audio id="shutter" src="shutter.mp3"></audio>
<canvas id="canvas" style="display:none;"></canvas>

<script>
let video=document.getElementById("cameraVideo");
let canvas=document.getElementById("canvas");
let ctx=canvas.getContext("2d");
let char=document.getElementById("char");
let preview=document.getElementById("preview");
let previewImage=document.getElementById("previewImage");

let flash=document.getElementById("flash");
let shutter=document.getElementById("shutter");

/* ===== カメラ ===== */
let currentStream=null;

async function startCamera(){
  if(currentStream){
    currentStream.getTracks().forEach(t=>t.stop());
  }

  currentStream=await navigator.mediaDevices.getUserMedia({
    video:{facingMode:"environment"}
  });

  video.srcObject=currentStream;
}
startCamera();

async function switchCamera(){
  let mode = video.srcObject.getVideoTracks()[0].getSettings().facingMode==="user"
    ? "environment" : "user";

  currentStream.getTracks().forEach(t=>t.stop());

  currentStream=await navigator.mediaDevices.getUserMedia({
    video:{facingMode:mode}
  });

  video.srcObject=currentStream;
}

/* ===== フィルター ===== */
const filters=["none","grayscale(1)","sepia(1)"];

function toggleFilter(){
  document.getElementById("filterPanel").classList.toggle("active");
}

function setFilter(i,el){
  video.style.filter=filters[i];
  document.querySelectorAll(".filterBtn").forEach(b=>b.classList.remove("active"));
  el.classList.add("active");
}

/* ===== 撮影 ===== */
document.getElementById("captureBtn").onclick=()=>{

  // 音
  shutter.currentTime=0;
  shutter.play().catch(()=>{});

  // フラッシュ
  flash.style.opacity=1;
  setTimeout(()=>flash.style.opacity=0,100);

  // UI非表示
  bottomBar.style.display="none";
  filterPanel.style.display="none";

  setTimeout(()=>{

    /* ===== 歪みなし描画 ===== */
    let vw=video.videoWidth;
    let vh=video.videoHeight;

    let cw=canvas.width=vw;
    let ch=canvas.height=vh;

    ctx.drawImage(video,0,0,cw,ch);

    let vRect=video.getBoundingClientRect();
    let cRect=char.getBoundingClientRect();

    let scale=cw/vRect.width;

    let x=(cRect.left-vRect.left)*scale;
    let y=(cRect.top-vRect.top)*scale;
    let w=cRect.width*scale;
    let h=cRect.height*scale;

    ctx.drawImage(char,x,y,w,h);

    previewImage.src=canvas.toDataURL();
    preview.style.display="flex";

    bottomBar.style.display="flex";
    filterPanel.style.display="flex";

  },80);
};

/* 保存 */
function saveImage(){
  let a=document.createElement("a");
  a.href=previewImage.src;
  a.download="photo.png";
  a.click();
  preview.style.display="none";
}

/* キャンセル */
function cancelShot(){
  preview.style.display="none";
}
</script>

</body>
</html>
