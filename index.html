<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AR Camera</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
}

/* カメラ */
video {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* キャラ */
#char {
  position: absolute;
  width: 150px;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

/* ===== UI固定レイヤー ===== */
#ui-layer {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1000;
  pointer-events: none;
}

/* 共通ボタン */
.control-btn {
  pointer-events: auto;
  height: 48px;
  padding: 0 16px;
  border-radius: 12px;
  background: rgba(0,0,0,0.6);
  color: white;
  border: none;
}

/* ハンバーガー */
#menuBtn {
  position: absolute;
  top: 20px;
  left: 20px;
  width: 60px;
  height: 40px;
}

/* メニュー */
#menu {
  position: absolute;
  top: 70px;
  left: 20px;
  display: none;
}

/* メニュー内ボタン */
.menu-btn {
  display: block;
  margin-top: 10px;
}

/* 撮影ボタン */
#captureBtn {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: 80px;
  pointer-events: auto;
}

/* プレビュー */
#preview {
  position: fixed;
  width: 100%;
  height: 100%;
  display: none;
  background: black;
  z-index: 2000;
}

#preview img {
  width: 100%;
}

#previewControls {
  position: absolute;
  bottom: 20px;
  width: 100%;
  text-align: center;
}

#previewControls button {
  margin: 10px;
  padding: 10px 20px;
  border-radius: 12px;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline></video>
<img id="char" src="soctest.png">

<div id="ui-layer">

  <button id="menuBtn" class="control-btn" onclick="toggleMenu()">≡</button>

  <div id="menu">
    <button class="control-btn menu-btn" onclick="switchCamera()">切替</button>
    <button class="control-btn menu-btn" onclick="applyFilter()">フィルタ</button>
  </div>

  <img id="captureBtn" src="camera.png">

</div>

<div id="preview">
  <img id="result">
  <div id="previewControls">
    <button onclick="saveImage()">保存</button>
    <button onclick="closePreview()">キャンセル</button>
  </div>
</div>

<audio id="shutter" src="shutter.mp3"></audio>
<canvas id="canvas" style="display:none;"></canvas>

<script>
let video = document.getElementById("video");
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");
let char = document.getElementById("char");
let preview = document.getElementById("preview");
let result = document.getElementById("result");
let shutter = document.getElementById("shutter");

let facingMode = "environment"; // ← 初期アウトカメラ

document.body.addEventListener("touchstart", () => {
  shutter.play().then(() => {
    shutter.pause();
    shutter.currentTime = 0;
  }).catch(()=>{});
}, { once: true });

async function startCamera() {
  let stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facingMode }
  });
  video.srcObject = stream;
}
startCamera();

function toggleMenu() {
  let m = document.getElementById("menu");
  m.style.display = m.style.display === "none" ? "block" : "none";
}

async function switchCamera() {
  facingMode = facingMode === "user" ? "environment" : "user";
  startCamera();
}

let filtered = false;
function applyFilter() {
  filtered = !filtered;
  video.style.filter = filtered ? "grayscale(1)" : "none";
}

document.getElementById("captureBtn").onclick = () => {

  shutter.currentTime = 0;
  shutter.play().catch(()=>{});

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  let vRect = video.getBoundingClientRect();
  let cRect = char.getBoundingClientRect();

  let scale = canvas.width / vRect.width;

  let x = (cRect.left - vRect.left) * scale;
  let y = (cRect.top - vRect.top) * scale;
  let w = cRect.width * scale;

  let aspect = char.naturalWidth / char.naturalHeight;
  let h = w / aspect;

  ctx.drawImage(char, x, y, w, h);

  result.src = canvas.toDataURL();
  preview.style.display = "block";
};

function saveImage() {
  let link = document.createElement("a");
  link.href = result.src;
  link.download = "photo.png";
  link.click();
  closePreview();
}

function closePreview() {
  preview.style.display = "none";
}

let dragging = false;

char.addEventListener("touchstart", () => dragging = true);
char.addEventListener("touchend", () => dragging = false);

document.addEventListener("touchmove", (e) => {
  if (!dragging) return;
  let t = e.touches[0];
  char.style.left = t.clientX + "px";
  char.style.top = t.clientY + "px";
});
</script>

</body>
</html>
