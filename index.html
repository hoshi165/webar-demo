<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html,body{
  margin:0;
  padding:0;
  overflow:hidden;
  background:black;
  touch-action: manipulation;
}

/* カメラ */
#cameraVideo{
  position:fixed;
  width:100vw;
  height:100vh;
  object-fit:cover;
  z-index:0;
  pointer-events:none;
}

/* キャラ */
#char{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(1);
  width:40%;
  z-index:10;
  touch-action:none;
}

/* 下バー */
#bottomBar{
  position:fixed;
  bottom:10px;
  width:100%;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:1000;
}

.ctrlBtn{
  width:60px;
  padding:10px;
  border:none;
  border-radius:20px;
  background:rgba(0,0,0,0.6);
  color:white;
}

/* 撮影 */
#captureBtn{
  width:50px;
  height:50px;
  border:none;
  background:none;
}

#captureBtn img{
  width:100%;
}

/* フィルター（フワッと出る） */
#filterPanel{
  position:fixed;
  bottom:-100px;
  width:100%;
  display:flex;
  justify-content:space-evenly;
  transition:0.3s ease;
  z-index:1000;
}

#filterPanel.active{
  bottom:80px;
}

/* フィルターボタン */
.filterBtn{
  width:70px;
  height:36px;
  border-radius:12px;
  border:none;
  background:white;
  color:black;
  font-size:12px;
}

/* 選択状態（反転） */
.filterBtn.active{
  background:black;
  color:white;
}

/* プレビュー */
#preview{
  position:fixed;
  width:100%;
  height:100%;
  background:black;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:2000;
}

#preview img{
  width:90%;
}

#previewControls{
  margin-top:20px;
}

/* フラッシュ */
#flash{
  position:fixed;
  width:100%;
  height:100%;
  background:white;
  opacity:0;
  z-index:1500;
}
</style>
</head>

<body>

<video id="cameraVideo" autoplay playsinline></video>
<img id="char" src="soctest.png">

<!-- フィルター -->
<div id="filterPanel">
  <button class="filterBtn" onclick="setFilter(0,this)">なし</button>
  <button class="filterBtn" onclick="setFilter(1,this)">セピア</button>
  <button class="filterBtn" onclick="setFilter(2,this)">明るい</button>
  <button class="filterBtn" onclick="setFilter(3,this)">ビンテージ</button>
</div>

<!-- 下部UI -->
<div id="bottomBar">
  <button class="ctrlBtn" onclick="switchCamera()">切替</button>

  <button id="captureBtn">
    <img src="camera.png">
  </button>

  <button class="ctrlBtn" onclick="toggleFilter()">フィルター</button>
</div>

<div id="preview">
  <img id="previewImage">
  <div id="previewControls">
    <button onclick="saveImage()">保存</button>
    <button onclick="cancelShot()">キャンセル</button>
  </div>
</div>

<div id="flash"></div>

<audio id="shutter" src="shutter.mp3"></audio>
<canvas id="canvas" style="display:none;"></canvas>

<script>
let video=document.getElementById("cameraVideo");
let canvas=document.getElementById("canvas");
let ctx=canvas.getContext("2d");
let char=document.getElementById("char");
let preview=document.getElementById("preview");
let previewImage=document.getElementById("previewImage");
let flash=document.getElementById("flash");
let shutter=document.getElementById("shutter");
let filterPanel=document.getElementById("filterPanel");

let currentStream=null;

/* カメラ */
async function startCamera(){
  try{
    currentStream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:"environment"}
    });
    video.srcObject=currentStream;
  }catch(e){
    alert("カメラ起動失敗（httpsで開いてください）");
  }
}
startCamera();

/* 切替 */
async function switchCamera(){
  try{
    let current=video.srcObject.getVideoTracks()[0].getSettings().facingMode;
    let next = current==="user"?"environment":"user";

    currentStream.getTracks().forEach(t=>t.stop());

    currentStream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:next}
    });

    video.srcObject=currentStream;

  }catch(e){
    alert("切替失敗");
  }
}

/* フィルター */
const filters=[
  "none",
  "sepia(1)",
  "brightness(1.4)",
  "contrast(1.2) saturate(0.8)"
];

function toggleFilter(){
  filterPanel.classList.toggle("active");
}

function setFilter(i,el){
  video.style.filter=filters[i];

  document.querySelectorAll(".filterBtn").forEach(b=>b.classList.remove("active"));
  el.classList.add("active");
}

/* 撮影 */
document.getElementById("captureBtn").onclick=()=>{

  shutter.currentTime=0;
  shutter.play().catch(()=>{});

  flash.style.opacity=1;
  setTimeout(()=>flash.style.opacity=0,100);

  setTimeout(()=>{

    canvas.width=video.videoWidth;
    canvas.height=video.videoHeight;

    ctx.drawImage(video,0,0);

    let vRect=video.getBoundingClientRect();
    let cRect=char.getBoundingClientRect();

    let scale=canvas.width/vRect.width;

    let x=(cRect.left-vRect.left)*scale;
    let y=(cRect.top-vRect.top)*scale;
    let w=cRect.width*scale;
    let h=cRect.height*scale;

    ctx.drawImage(char,x,y,w,h);

    previewImage.src=canvas.toDataURL();
    preview.style.display="flex";

  },80);
};

/* 保存 */
function saveImage(){
  let a=document.createElement("a");
  a.href=previewImage.src;
  a.download="photo.png";
  a.click();
  preview.style.display="none";
}

/* キャンセル */
function cancelShot(){
  preview.style.display="none";
}

/* キャラ移動 */
let isDragging=false;

char.addEventListener("touchstart",()=>isDragging=true);
char.addEventListener("touchend",()=>isDragging=false);

char.addEventListener("touchmove",(e)=>{
  if(!isDragging)return;
  let t=e.touches[0];
  char.style.left=t.clientX+"px";
  char.style.top=t.clientY+"px";
});

/* ピンチズーム */
let startDist=0;
let startScale=1;
let scale=1;

char.addEventListener("touchstart",(e)=>{
  if(e.touches.length===2){
    startDist=getDist(e);
    startScale=scale;
  }
});

char.addEventListener("touchmove",(e)=>{
  if(e.touches.length===2){
    let newDist=getDist(e);
    scale=startScale*(newDist/startDist);
    char.style.transform=`translate(-50%,-50%) scale(${scale})`;
  }
});

function getDist(e){
  let dx=e.touches[0].clientX-e.touches[1].clientX;
  let dy=e.touches[0].clientY-e.touches[1].clientY;
  return Math.sqrt(dx*dx+dy*dy);
}
</script>

</body>
</html>
