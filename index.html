<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebAR Camera</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
}

/* カメラ */
video {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ARレイヤー（キャラなど） */
#ar-layer {
  position: absolute;
  top: 0;
  left: 0;
}

/* UIレイヤー（固定） */
#ui-layer {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 999;
  pointer-events: none;
}

/* 共通ボタン */
.control-btn {
  position: absolute;
  pointer-events: auto;
  height: 80%;
  padding: 10px 16px;
  border-radius: 12px;
  background: rgba(0,0,0,0.6);
  color: white;
  border: none;
}

/* ハンバーガー */
#menuBtn {
  top: 20px;
  left: 20px;
  transform: scaleX(1.3) scaleY(0.8);
}

/* カメラボタン */
#captureBtn {
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
}

/* フィルター */
#filterBtn {
  top: 20px;
  right: 20px;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline></video>

<canvas id="ar-layer"></canvas>

<!-- UI -->
<div id="ui-layer">
  <button id="menuBtn" class="control-btn">≡</button>
  <button id="captureBtn" class="control-btn">撮影</button>
  <button id="filterBtn" class="control-btn">Filter</button>
</div>

<script>
const video = document.getElementById("video");

// アウトカメラ起動（fallback付き）
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    });
    video.srcObject = stream;
  } catch (e) {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: true
    });
    video.srcObject = stream;
  }
}

startCamera();
</script>

</body>
</html>
