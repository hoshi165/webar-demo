<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>
html,body{margin:0;padding:0;overflow:hidden;background:black;}
#cameraVideo{position:fixed;width:100vw;height:100vh;object-fit:cover;}
#char{
  position:fixed;left:50%;top:50%;
  transform:translate(-50%,-50%);
  width:40%;touch-action:none;
  filter: drop-shadow(0px 15px 15px rgba(0,0,0,0.25));
}
#menuBtn{position:fixed;top:15px;left:15px;z-index:20;font-size:24px;display:none;background:rgba(0,0,0,0.5);color:white;border:none;border-radius:12px;padding:8px 12px;}
#menu{position:fixed;top:60px;left:15px;display:flex;flex-direction:column;z-index:20;}
.menuBtn{margin:5px 0;padding:10px 14px;border:none;border-radius:20px;background:rgba(255,255,255,0.7);backdrop-filter: blur(10px);}
#captureBtn{position:fixed;bottom:20px;right:20px;width:80px;height:80px;border:none;background:transparent;}
#captureBtn:active{transform:scale(0.75);}
#captureBtn img{width:100%;}
#preview{position:fixed;width:100%;height:100%;background:black;display:none;justify-content:center;align-items:center;flex-direction:column;z-index:30;}
#preview img{width:90%;}
#loading{position:fixed;width:100%;height:100%;background:black;z-index:50;display:none;}
#flash{position:fixed;width:100%;height:100%;background:white;opacity:0;pointer-events:none;z-index:40;}
</style>
</head>

<body>

<video id="cameraVideo" autoplay playsinline muted></video>
<img id="char" src="soctest.png">

<button id="menuBtn">☰</button>

<div id="menu">
  <button class="menuBtn" onclick="startCamera()">カメラ</button>
  <button class="menuBtn" onclick="switchCamera()">切替</button>
  <button class="menuBtn" onclick="changeFilter()">フィルター</button>
</div>

<button id="captureBtn">
  <img src="camera.png">
</button>

<div id="preview">
  <img id="previewImage">
  <button class="menuBtn" onclick="closePreview()">閉じる</button>
</div>

<div id="loading"></div>
<div id="flash"></div>

<canvas id="canvas" style="display:none;"></canvas>
<audio id="shutterSound" src="shutter.mp3" preload="auto"></audio>

<script>
let video=document.getElementById("cameraVideo");
let stream;
let facing="environment";

/* ===== 音声解放 ===== */
let audioUnlocked=false;
document.body.addEventListener("touchstart", ()=>{
  if(audioUnlocked) return;
  let s=document.getElementById("shutterSound");
  s.play().then(()=>{
    s.pause();
    s.currentTime=0;
    audioUnlocked=true;
  }).catch(()=>{});
},{once:true});

/* カメラ起動 */
function startCamera(){
  navigator.mediaDevices.getUserMedia({
    video:{facingMode:{ideal:facing}},
    audio:false
  })
  .then(s=>{
    stream=s;
    video.srcObject=s;
    document.getElementById("menu").style.display="none";
    document.getElementById("menuBtn").style.display="block";
  })
  .catch(()=>alert("カメラ許可が必要です"));
}

/* カメラ切替 */
function switchCamera(){
  facing=(facing==="environment")?"user":"environment";
  if(stream){
    stream.getTracks().forEach(t=>t.stop());
    stream=null;
  }
  startCamera();
}

/* メニュー */
let menu=document.getElementById("menu");
let menuBtn=document.getElementById("menuBtn");
menuBtn.onclick=()=>menu.style.display=(menu.style.display==="none")?"flex":"none";

/* フィルター */
const filters=["none","grayscale(1)","sepia(1)","contrast(1.3) saturate(1.4)","brightness(1.2)"];
let currentFilter=0;
function changeFilter(){
  currentFilter=(currentFilter+1)%filters.length;
  video.style.filter=filters[currentFilter];
}

/* ===== キャラ操作 ===== */
let char=document.getElementById("char");
let offsetX=0,offsetY=0,scale=1,rotation=0;
let startX,startY,isDragging=false;
let initialDistance=1,initialAngle=0;

char.addEventListener("touchstart",e=>{
  if(e.touches.length===1){
    isDragging=true;
    startX=e.touches[0].clientX-offsetX;
    startY=e.touches[0].clientY-offsetY;
  }
  if(e.touches.length===2){
    initialDistance=getDistance(e.touches)||1;
    initialAngle=getAngle(e.touches)||0;
  }
});

char.addEventListener("touchmove",e=>{
  e.preventDefault();

  if(e.touches.length===1 && isDragging){
    offsetX=e.touches[0].clientX-startX;
    offsetY=e.touches[0].clientY-startY;
  }

  if(e.touches.length===2){
    let d=getDistance(e.touches);
    let a=getAngle(e.touches);

    let factor=d/initialDistance;
    scale=scale*factor;
    scale=Math.max(0.3,Math.min(scale,3));

    rotation+=a-initialAngle;
    initialDistance=d;
    initialAngle=a;
  }

  char.style.transform=
  `translate(${offsetX}px,${offsetY}px)
   scale(${scale})
   rotate(${rotation}deg)`;
});

char.addEventListener("touchend",()=>isDragging=false);

function getDistance(t){
  let dx=t[0].clientX-t[1].clientX;
  let dy=t[0].clientY-t[1].clientY;
  return Math.sqrt(dx*dx+dy*dy);
}
function getAngle(t){
  let dx=t[1].clientX-t[0].clientX;
  let dy=t[1].clientY-t[0].clientY;
  return Math.atan2(dy,dx)*180/Math.PI;
}

/* フラッシュ */
function flash(){
  const f=document.getElementById("flash");
  f.style.opacity=1;
  setTimeout(()=>{f.style.opacity=0;},100);
}

/* ===== 撮影 ===== */
document.getElementById("captureBtn").onclick=()=>{
  let sound=document.getElementById("shutterSound");
  sound.currentTime=0;
  sound.play().catch(()=>{});

  if(navigator.vibrate){
    navigator.vibrate(50);
  }

  flash();

  let canvas=document.getElementById("canvas");
  let ctx=canvas.getContext("2d");

  let vw=video.videoWidth;
  let vh=video.videoHeight;
  canvas.width=vw;
  canvas.height=vh;

  let cw=canvas.width;
  let ch=canvas.height;

  let scaleFit=Math.max(cw/vw,ch/vh);
  let sw=cw/scaleFit;
  let sh=ch/scaleFit;
  let sx=(vw-sw)/2;
  let sy=(vh-sh)/2;

  ctx.filter=filters[currentFilter];
  ctx.drawImage(video,sx,sy,sw,sh,0,0,cw,ch);

  let rect=char.getBoundingClientRect();
  let vRect=video.getBoundingClientRect();

  let displayRatio=vRect.width/vRect.height;
  let videoRatio=vw/vh;

  let offsetCX=0,offsetCY=0;
  let displayW=vRect.width;
  let displayH=vRect.height;

  if(videoRatio>displayRatio){
    displayW=vRect.height*videoRatio;
    offsetCX=(displayW-vRect.width)/2;
  }else{
    displayH=vRect.width/videoRatio;
    offsetCY=(displayH-vRect.height)/2;
  }

  let x=((rect.left-vRect.left+offsetCX)/displayW)*cw;
  let y=((rect.top-vRect.top+offsetCY)/displayH)*ch;
  let w=(rect.width/displayW)*cw;
  let h=(rect.height/displayH)*ch;

  ctx.filter="none";

  ctx.save();
  ctx.translate(x+w/2,y+h/2);
  ctx.rotate(rotation*Math.PI/180);
  ctx.scale(scale,scale);
  ctx.drawImage(char,-w/2,-h/2,w,h);
  ctx.restore();

  let data=canvas.toDataURL("image/png");

  document.getElementById("previewImage").src=data;
  document.getElementById("preview").style.display="flex";

  let link=document.createElement("a");
  link.href=data;
  link.download="photo.png";
  link.click();
};

/* プレビュー */
function closePreview(){
  document.getElementById("preview").style.display="none";
}
</script>

</body>
</html>
