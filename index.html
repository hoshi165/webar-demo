<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebAR Demo</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: sans-serif;
  background: black;
}

/* ボタン（ぬる） */
button {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  padding: 12px 20px;
  font-size: 16px;
  border-radius: 10px;
  border: none;
  background: white;
  transition: all 0.3s ease;
}

button:active {
  transform: translateX(-50%) scale(0.9);
}

/* プレビュー */
#preview {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 120px;
  border-radius: 10px;
  opacity: 0;
  transition: opacity 0.5s;
}

/* ローディング */
#loading {
  position: absolute;
  color: white;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}
</style>
</head>

<body>

<div id="loading">Loading...</div>

<video id="video" autoplay playsinline style="display:none;"></video>
<canvas id="canvas"></canvas>

<img id="preview" />

<button onclick="takePhoto()">撮影</button>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const preview = document.getElementById("preview");
const loading = document.getElementById("loading");

// サノマル
const chara = new Image();
chara.src = "https://via.placeholder.com/200"; // ←好きな画像に変更

let opacity = 0;
let flash = 0;

// カメラ起動
navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => {
  video.srcObject = stream;
  loading.style.display = "none";
})
.catch(err => {
  alert("カメラ許可が必要です");
});

// 描画ループ
function render() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  // フィルター（全体）
  ctx.filter = "contrast(1.1) brightness(1.05) saturate(1.2)";

  // カメラ
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  // フェードイン
  if (opacity < 1) opacity += 0.01;
  ctx.globalAlpha = opacity;

  // 影
  ctx.shadowColor = "rgba(0,0,0,0.5)";
  ctx.shadowBlur = 20;

  // キャラ
  ctx.drawImage(chara, canvas.width/2 - 100, canvas.height/2 - 100, 200, 200);

  ctx.globalAlpha = 1;

  // フラッシュ
  if (flash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${flash})`;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    flash -= 0.05;
  }

  requestAnimationFrame(render);
}

render();

// 撮影
function takePhoto() {
  flash = 1;

  setTimeout(() => {
    const data = canvas.toDataURL("image/png");
    preview.src = data;
    preview.style.opacity = 1;
  }, 100);
}
</script>

</body>
</html>
