<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AR Camera</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
}

video {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#char {
  position: absolute;
  width: 150px;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

#ui {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 10;
}

button {
  margin: 5px;
  padding: 10px;
}

#captureBtn {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: 80px;
}

#preview {
  position: absolute;
  width: 100%;
  height: 100%;
  display: none;
  background: black;
}

#preview img {
  width: 100%;
}

#saveBtn {
  position: absolute;
  bottom: 20px;
  right: 20px;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline></video>
<img id="char" src="soctest.png">

<div id="ui">
  <button onclick="toggleMenu()">☰</button>
  <div id="menu" style="display:none;">
    <button onclick="switchCamera()">切替</button>
    <button onclick="applyFilter()">フィルタ</button>
  </div>
</div>

<img id="captureBtn" src="camera.png">

<div id="preview">
  <img id="result">
  <button id="saveBtn" onclick="saveImage()">保存</button>
</div>

<audio id="shutter" src="shutter.mp3"></audio>

<canvas id="canvas" style="display:none;"></canvas>

<script>
let video = document.getElementById("video");
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");
let char = document.getElementById("char");
let preview = document.getElementById("preview");
let result = document.getElementById("result");
let shutter = document.getElementById("shutter");

let facingMode = "user";

// カメラ起動
async function startCamera() {
  let stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facingMode }
  });
  video.srcObject = stream;
}
startCamera();

// メニュー
function toggleMenu() {
  let m = document.getElementById("menu");
  m.style.display = m.style.display === "none" ? "block" : "none";
}

// カメラ切替
async function switchCamera() {
  facingMode = facingMode === "user" ? "environment" : "user";
  startCamera();
}

// フィルター
let filtered = false;
function applyFilter() {
  filtered = !filtered;
  video.style.filter = filtered ? "grayscale(1)" : "none";
}

// 撮影
document.getElementById("captureBtn").onclick = () => {

  shutter.play().catch(()=>{}); // iOS対策

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  // カメラ描画
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  // ===== 歪み完全修正ここ =====
  let vRect = video.getBoundingClientRect();
  let cRect = char.getBoundingClientRect();

  let scale = canvas.width / vRect.width;

  let x = (cRect.left - vRect.left) * scale;
  let y = (cRect.top - vRect.top) * scale;
  let w = cRect.width * scale;

  // 比率固定
  let aspect = char.naturalWidth / char.naturalHeight;
  let h = w / aspect;

  ctx.drawImage(char, x, y, w, h);
  // ===========================

  result.src = canvas.toDataURL();
  preview.style.display = "block";
};

// 保存
function saveImage() {
  let link = document.createElement("a");
  link.href = result.src;
  link.download = "photo.png";
  link.click();
}

// キャラ移動
let dragging = false;

char.addEventListener("touchstart", () => dragging = true);
char.addEventListener("touchend", () => dragging = false);

document.addEventListener("touchmove", (e) => {
  if (!dragging) return;

  let t = e.touches[0];
  char.style.left = t.clientX + "px";
  char.style.top = t.clientY + "px";
});

</script>

</body>
</html>
