<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<!-- ★ ここ修正（ズーム制限削除） -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html,body{
  margin:0;
  padding:0;
  overflow:hidden;
  background:black;
  touch-action: manipulation; /* ★追加 */
}

/* カメラ（触れないようにする） */
#cameraVideo{
  position:fixed;
  width:100vw;
  height:100vh;
  object-fit:cover;
  z-index:0;
  pointer-events:none; /* ★超重要 */
}

/* キャラ */
#char{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:40%;
  z-index:10;
  pointer-events:auto;
}

/* 下UI */
#bottomBar{
  position:fixed;
  bottom:20px;
  width:100%;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:1000; /* ★最前面 */
}

.ctrlBtn{
  width:84px;
  padding:10px;
  border:none;
  border-radius:20px;
}

/* 撮影 */
#captureBtn{
  width:58px;
  height:58px;
  border:none;
  background:none;
}

#captureBtn img{
  width:100%;
}

/* フィルター */
#filterPanel{
  position:fixed;
  bottom:-120px;
  width:100%;
  display:flex;
  justify-content:space-around;
  transition:0.3s;
  z-index:1000;
  pointer-events:none;
}

#filterPanel.active{
  bottom:90px;
  pointer-events:auto;
}

.filterBtn{
  width:80px;
  padding:8px;
  background:#888;
  color:white;
  border:none;
  border-radius:16px;
}

.filterBtn.active{
  background:black;
}

/* プレビュー */
#preview{
  position:fixed;
  width:100%;
  height:100%;
  background:black;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:2000;
}

#preview img{
  width:90%;
}

#previewControls{
  margin-top:20px;
}

/* フラッシュ */
#flash{
  position:fixed;
  width:100%;
  height:100%;
  background:white;
  opacity:0;
  z-index:1500;
}
</style>
</head>

<body>

<video id="cameraVideo" autoplay playsinline></video>
<img id="char" src="soctest.png">

<div id="bottomBar">
  <button class="ctrlBtn" onclick="switchCamera()">カメラ切替</button>

  <button id="captureBtn">
    <img src="camera.png">
  </button>

  <button class="ctrlBtn" onclick="toggleFilter()">フィルター</button>
</div>

<div id="filterPanel">
  <button class="filterBtn" onclick="setFilter(0,this)">なし</button>
  <button class="filterBtn" onclick="setFilter(1,this)">白黒</button>
  <button class="filterBtn" onclick="setFilter(2,this)">セピア</button>
</div>

<div id="preview">
  <img id="previewImage">
  <div id="previewControls">
    <button onclick="saveImage()">保存</button>
    <button onclick="cancelShot()">キャンセル</button>
  </div>
</div>

<div id="flash"></div>

<audio id="shutter" src="shutter.mp3"></audio>
<canvas id="canvas" style="display:none;"></canvas>

<script>
let video=document.getElementById("cameraVideo");
let canvas=document.getElementById("canvas");
let ctx=canvas.getContext("2d");
let char=document.getElementById("char");
let preview=document.getElementById("preview");
let previewImage=document.getElementById("previewImage");
let flash=document.getElementById("flash");
let shutter=document.getElementById("shutter");
let bottomBar=document.getElementById("bottomBar");
let filterPanel=document.getElementById("filterPanel");

let currentStream=null;

/* カメラ */
async function startCamera(){
  try{
    if(currentStream){
      currentStream.getTracks().forEach(t=>t.stop());
    }

    currentStream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:"environment"}
    });

    video.srcObject = currentStream;

  }catch(e){
    alert("カメラエラー: "+e.message);
  }
}
startCamera();

/* 切替 */
async function switchCamera(){
  try{
    let mode = "user";

    if(video.srcObject){
      let current = video.srcObject.getVideoTracks()[0].getSettings().facingMode;
      mode = current==="user" ? "environment" : "user";
    }

    if(currentStream){
      currentStream.getTracks().forEach(t=>t.stop());
    }

    currentStream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:mode}
    });

    video.srcObject = currentStream;

  }catch(e){
    alert("切替エラー");
  }
}

/* フィルター */
const filters=["none","grayscale(1)","sepia(1)"];

function toggleFilter(){
  filterPanel.classList.toggle("active");
}

function setFilter(i,el){
  video.style.filter=filters[i];
  document.querySelectorAll(".filterBtn").forEach(b=>b.classList.remove("active"));
  el.classList.add("active");
}

/* 撮影 */
document.getElementById("captureBtn").onclick=()=>{

  shutter.currentTime=0;
  shutter.play().catch(()=>{});

  flash.style.opacity=1;
  setTimeout(()=>flash.style.opacity=0,100);

  setTimeout(()=>{

    if(!video.videoWidth){
      alert("カメラ未取得");
      return;
    }

    canvas.width=video.videoWidth;
    canvas.height=video.videoHeight;

    ctx.drawImage(video,0,0);

    let vRect=video.getBoundingClientRect();
    let cRect=char.getBoundingClientRect();

    let scale=canvas.width/vRect.width;

    let x=(cRect.left-vRect.left)*scale;
    let y=(cRect.top-vRect.top)*scale;
    let w=cRect.width*scale;
    let h=cRect.height*scale;

    ctx.drawImage(char,x,y,w,h);

    previewImage.src=canvas.toDataURL();
    preview.style.display="flex";

  },80);
};

/* 保存 */
function saveImage(){
  let a=document.createElement("a");
  a.href=previewImage.src;
  a.download="photo.png";
  a.click();
  preview.style.display="none";
}

/* キャンセル */
function cancelShot(){
  preview.style.display="none";
}
</script>

</body>
</html>
