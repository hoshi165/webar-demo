<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>WebAR Demo</title>
<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
}

video, canvas {
  position: absolute;
  top: 0;
  left: 0;
}

/* 三ライン */
#menuBtn {
  position: absolute;
  top: 20px;
  left: 20px;
  font-size: 30px;
  color: white;
  z-index: 10;
  cursor: pointer;
  transform: scale(1.2);
}

/* メニュー */
#menu {
  position: absolute;
  top: 70px;
  left: 20px;
  background: rgba(0,0,0,0.7);
  padding: 10px;
  border-radius: 10px;
  display: none;
}

button {
  display: block;
  margin: 5px 0;
}
</style>
</head>

<body>

<div id="menuBtn">☰</div>

<div id="menu">
  <button onclick="changeFilter('none')">通常</button>
  <button onclick="changeFilter('mono')">白黒</button>
  <button onclick="changeFilter('cool')">クール</button>
</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let filterMode = "none";

// サノマル
const chara = new Image();
chara.src = "chara.png";

// カメラ起動
navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => {
  video.srcObject = stream;
});

// サイズ調整
video.addEventListener("loadedmetadata", () => {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  draw();
});

// メニュー開閉
document.getElementById("menuBtn").onclick = () => {
  const menu = document.getElementById("menu");
  menu.style.display = menu.style.display === "block" ? "none" : "block";
};

// フィルター切替
function changeFilter(mode) {
  filterMode = mode;
}

// フィルター
function getFilter() {
  if (filterMode === "mono") return "grayscale(1)";
  if (filterMode === "cool") return "brightness(1.1) contrast(1.2)";
  return "none";
}

// 描画ループ
function draw() {
  requestAnimationFrame(draw);

  // フィルター
  ctx.filter = getFilter();
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  // サノマルナシ
  ctx.filter = "none";

  // ===== =====
  const baseSize = 200;

  // 縦横比
  const aspect = chara.width / chara.height;

  const drawWidth = baseSize;
  const drawHeight = baseSize / aspect;

  ctx.drawImage(
    chara,
    canvas.width / 2 - drawWidth / 2,
    canvas.height / 2 - drawHeight / 2,
    drawWidth,
    drawHeight
  );
}
</script>

</body>
</html>
