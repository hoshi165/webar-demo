<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Factory AR Camera</title>
<style>
  /* 基本レイアウト：カメラ映像を全画面にフィットさせる */
  body { margin:0; overflow:hidden; background:#000; font-family: 'Helvetica Neue', Arial, sans-serif; }
  video { position: absolute; top:0; left:0; width:100vw; height:100vh; object-fit: cover; z-index: 1; }
  #glCanvas { position:absolute; top:0; left:0; width:100vw; height:100vh; object-fit:cover; z-index: 2; pointer-events: none; }
  
  /* キャラクター操作ボックス */
  #charBox { 
    position:absolute; width:150px; height:150px;
    top:50%; left:50%; transform:translate(-50%,-50%); 
    z-index: 10; touch-action:none; border: none;
  }

  /* 操作UI：工場での利用を想定し、押しやすいサイズと透過感 */
  #bottom-bar { position:fixed; bottom:30px; width:100%; display:flex; justify-content:space-around; align-items:center; z-index:1000; }
  .control-btn { width:72px; height:48px; border-radius:8px; background:rgba(0,0,0,0.6); color:white; border:none; backdrop-filter:blur(10px); font-size: 12px; cursor: pointer; }
  #captureBtn { width:70px; height:70px; cursor: pointer; filter: drop-shadow(0 0 10px rgba(0,0,0,0.5)); }

  /* パネルUI：下からスライドインするアニメーション */
  .panel { position:fixed; bottom:-200px; width:100%; background:rgba(255,255,255,0.95); display:flex; justify-content:space-around; padding:25px 0; transition:0.4s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 1100; border-radius: 20px 20px 0 0; box-shadow: 0 -5px 15px rgba(0,0,0,0.2); }
  .panel.active { bottom:130px; }
  .panel button { width:90px; height:45px; border-radius:10px; border:none; background: #f0f0f0; color: #333; font-weight: bold; cursor: pointer; }
  .panel button.active { background:#007AFF; color: white; }

  /* プレビュー画面 */
  #preview { position:fixed; inset:0; display:none; flex-direction:column; background:#000; z-index:2000; align-items:center; justify-content:center; }
  #result { width:100%; height:80%; object-fit: contain; }
</style>
</head>
<body>

<video id="video" autoplay playsinline muted crossorigin="anonymous"></video>
<canvas id="glCanvas"></canvas>
<div id="charBox"></div>

<div id="bottom-bar">
  <button class="control-btn" onclick="switchCamera()">カメラ切替</button>
  <button class="control-btn" onclick="togglePanel('charPanel')">キャラ選択</button>
  <img id="captureBtn" src="camera.png" alt="シャッター" onclick="captureImage()">
  <button class="control-btn" onclick="togglePanel('filterPanel')">フィルタ</button>
  <button class="control-btn" onclick="resetCharacterTransform()">リセット</button>
</div>

<div id="filterPanel" class="panel">
  <button data-filter="none" class="active">通常</button>
  <button data-filter="retro">レトロ</button>
  <button data-filter="vivid">鮮やか</button>
  <button data-filter="cinema">シネマ</button>
</div>

<div id="charPanel" class="panel">
  <button onclick="selectCharacter(1)">キャラ1</button>
  <button onclick="selectCharacter(2)">キャラ2</button>
</div>

<div id="preview">
  <img id="result">
  <div style="margin-top:20px; display: flex; gap: 20px;">
    <button class="control-btn" style="width: 120px;" onclick="saveImage()">保存する</button>
    <button class="control-btn" style="width: 120px;" onclick="closePreview()">撮り直す</button>
  </div>
</div>

<script>
/**
 * グローバル定数・変数の定義
 * AI特有の短縮名を避け、役割が明確な命名に変更
 */
const videoElement = document.getElementById("video");
const canvasElement = document.getElementById("glCanvas");
const charBoxElement = document.getElementById("charBox");
const gl = canvasElement.getContext("webgl", { preserveDrawingBuffer: true, alpha: true });

let currentFilterMode = "none";
const animationStartTime = Date.now();
let cameraFacingMode = "environment"; // 背面カメラをデフォルトに
let characterImage = new Image();
characterImage.crossOrigin = "anonymous";
characterImage.src = "soctest1.png";

/**
 * WebGL シェーダー定義
 * 高精度な画像処理ロジック
 */
const vertexShaderSource = `
  attribute vec2 position;
  varying vec2 vTexCoord;
  void main() {
    vTexCoord = position * 0.5 + 0.5;
    gl_Position = vec4(position, 0, 1);
  }
`;

const fragmentShaderSource = `
  precision mediump float;
  varying vec2 vTexCoord;
  uniform sampler2D uVideoTexture;
  uniform sampler2D uCharTexture;
  uniform int uFilterType;
  uniform float uTime;
  uniform vec4 uCharRect; // x, y, width, height

  void main() {
    // カメラ映像の取得（上下反転補正）
    vec4 videoColor = texture2D(uVideoTexture, vec2(vTexCoord.x, 1.0 - vTexCoord.y));
    
    // フィルタ処理
    if(uFilterType == 1) { // レトロ
      float gray = dot(videoColor.rgb, vec3(0.299, 0.587, 0.114));
      videoColor.rgb = mix(videoColor.rgb, vec3(gray) * vec3(1.2, 1.0, 0.8), 0.6);
    } 
    else if(uFilterType == 2) { // 鮮やか
      videoColor.rgb = clamp((videoColor.rgb - 0.5) * 1.5 + 0.5, 0.0, 1.0);
    } 
    else if(uFilterType == 3) { // シネマ
      videoColor.rgb = pow(videoColor.rgb * vec3(0.8, 0.9, 1.0), vec3(1.3));
    }

    vec4 finalColor = videoColor;

    // キャラクターの描画判定
    if(vTexCoord.x >= uCharRect.x && vTexCoord.x <= uCharRect.x + uCharRect.z &&
       vTexCoord.y >= uCharRect.y && vTexCoord.y <= uCharRect.y + uCharRect.w) {
      
      vec2 charUV = (vTexCoord - uCharRect.xy) / uCharRect.zw;
      
      // キャラクターに微細なパルスアニメーション（浮遊感）を付与
      float pulse = sin(uTime * 2.5) * 0.015;
      vec2 animatedUV = charUV + (charUV - 0.5) * pulse;
      
      vec4 charColor = texture2D(uCharTexture, vec2(animatedUV.x, 1.0 - animatedUV.y));
      finalColor.rgb = mix(videoColor.rgb, charColor.rgb, charColor.a);
    }

    gl_FragColor = finalColor;
  }
`;

/**
 * WebGL 初期化処理
 */
function createShader(gl, type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(shader));
    gl.deleteShader(shader);
    return null;
  }
  return shader;
}

const program = gl.createProgram();
gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vertexShaderSource));
gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource));
gl.linkProgram(program);
gl.useProgram(program);

// 頂点バッファの設定
const buffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const posAttrib = gl.getAttribLocation(program, "position");
gl.enableVertexAttribArray(posAttrib);
gl.vertexAttribPointer(posAttrib, 2, gl.FLOAT, false, 0, 0);

// ユニフォーム変数の場所を取得
const locVideo = gl.getUniformLocation(program, "uVideoTexture");
const locChar = gl.getUniformLocation(program, "uCharTexture");
const locFilter = gl.getUniformLocation(program, "uFilterType");
const locTime = gl.getUniformLocation(program, "uTime");
const locRect = gl.getUniformLocation(program, "uCharRect");

// テクスチャ初期化
const videoTexture = gl.createTexture();
const charTexture = gl.createTexture();
[videoTexture, charTexture].forEach(tex => {
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
});

/**
 * カメラの開始
 */
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ 
      video: { facingMode: cameraFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } } 
    });
    videoElement.srcObject = stream;
    videoElement.onloadedmetadata = () => {
      videoElement.play();
      // カメラの準備ができるまで少し待機
      setTimeout(() => {
        canvasElement.width = videoElement.videoWidth;
        canvasElement.height = videoElement.videoHeight;
        requestAnimationFrame(renderLoop);
      }, 500);
    };
  } catch (err) {
    console.error("Camera access denied:", err);
    alert("カメラの起動に失敗しました。ブラウザの設定でカメラの使用を許可してください。");
  }
}

/**
 * メイン描画ループ
 */
function renderLoop() {
  if (videoElement.readyState >= 2) {
    gl.viewport(0, 0, canvasElement.width, canvasElement.height);
    
    // ビデオテクスチャ更新
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, videoTexture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, videoElement);
    gl.uniform1i(locVideo, 0);

    // キャラクターテクスチャ更新
    if(characterImage.complete) {
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, charTexture);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, characterImage);
      gl.uniform1i(locChar, 1);
    }

    // パラメータ更新
    gl.uniform1f(locTime, (Date.now() - animationStartTime) / 1000.0);
    let filterId = (currentFilterMode==="retro"?1 : currentFilterMode==="vivid"?2 : currentFilterMode==="cinema"?3 : 0);
    gl.uniform1i(locFilter, filterId);

    // 座標計算：CSS上の表示位置をWebGLの正規化座標(0.0-1.0)に変換
    const rect = charBoxElement.getBoundingClientRect();
    const winW = window.innerWidth, winH = window.innerHeight;
    
    const posX = rect.left / winW;
    const posY = 1.0 - (rect.top + rect.height) / winH; // Y軸反転
    const width = rect.width / winW;
    const height = rect.height / winH;

    gl.uniform4f(locRect, posX, posY, width, height);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  requestAnimationFrame(renderLoop);
}

/**
 * 各種コントロール関数
 */
function captureImage() {
  const resultImg = document.getElementById("result");
  resultImg.src = canvasElement.toDataURL("image/png");
  document.getElementById("preview").style.display = "flex";
}

function togglePanel(panelId) {
  const target = document.getElementById(panelId);
  const isOpen = target.classList.contains("active");
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  if(!isOpen) target.classList.add("active");
}

function selectCharacter(id){ 
  characterImage = new Image();
  characterImage.crossOrigin = "anonymous";
  characterImage.src = id === 1 ? "soctest1.png" : "soctest2.png"; 
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
}

function switchCamera(){
  cameraFacingMode = (cameraFacingMode === "user" ? "environment" : "user");
  startCamera();
}

function closePreview(){
  document.getElementById("preview").style.display = "none";
}

function saveImage(){
  const link = document.createElement("a");
  link.href = document.getElementById("result").src;
  link.download = `factory_photo_${Date.now()}.png`;
  link.click();
}

/**
 * インタラクション：タッチ操作（移動・拡大縮小）
 */
let offsetPosX = window.innerWidth / 2, offsetPosY = window.innerHeight / 2;
let currentScale = 1;
let isDragging = false, isPinching = false;
let startX, startY, startDist, startScale;

charBoxElement.addEventListener("touchstart", e => {
  if(e.touches.length === 1){
    isDragging = true;
    startX = e.touches[0].clientX - offsetPosX;
    startY = e.touches[0].clientY - offsetPosY;
  }
  if(e.touches.length === 2){
    isPinching = true;
    startDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    startScale = currentScale;
  }
  e.preventDefault();
}, {passive: false});

document.addEventListener("touchmove", e => {
  if(isDragging && e.touches.length === 1){
    offsetPosX = e.touches[0].clientX - startX;
    offsetPosY = e.touches[0].clientY - startY;
    charBoxElement.style.left = offsetPosX + "px";
    charBoxElement.style.top = offsetPosY + "px";
  }
  if(isPinching && e.touches.length === 2){
    let dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    currentScale = startScale * (dist / startDist);
    // 最小・最大サイズの制限（工場内での使い勝手を考慮）
    currentScale = Math.min(Math.max(currentScale, 0.5), 3.0);
    charBoxElement.style.width = (150 * currentScale) + "px";
    charBoxElement.style.height = (150 * currentScale) + "px";
  }
}, {passive: false});

document.addEventListener("touchend", () => {
  isDragging = false;
  isPinching = false;
});

function resetCharacterTransform(){
  offsetPosX = window.innerWidth / 2;
  offsetPosY = window.innerHeight / 2;
  currentScale = 1;
  charBoxElement.style.left = "50%";
  charBoxElement.style.top = "50%";
  charBoxElement.style.width = "150px";
  charBoxElement.style.height = "150px";
}

// フィルタボタンのイベント登録
document.querySelectorAll("#filterPanel button").forEach(btn => { 
  btn.onclick = () => { 
    currentFilterMode = btn.dataset.filter; 
    document.querySelectorAll("#filterPanel button").forEach(b => b.classList.remove("active")); 
    btn.classList.add("active"); 
  }; 
});

// アプリケーション起動
startCamera();
</script>
</body>
</html>
